# A2 — Component specifications, machine-readable.
#
# THIS FILE IS THE SOURCE OF TRUTH for service topology, IAM and Kubernetes.
# platform/generate.py renders IAM policies and k8s manifests FROM this file,
# so the deployed system cannot drift from the architecture document.
#
# Change here first, regenerate, then commit both. Never hand-edit generated output.

meta:
  region: eu-central-1                 # correction 2 (v5)
  account_id: "558069890522"        # eu-central-1 MedZen account (profile: medzen)
  namespace: medzen
  cluster_name: medzen
  # S3 zones from A3. One bucket, prefixes are the lineage boundary.
  buckets:
    data: medzen-speech                # raw/ curated/ eval/ approved/
    audio_cache: medzen-audio-cache    # tts/ (90d lifecycle), user-audio/ (30d)
  # Both buckets have SSE-KMS default encryption with customer-managed keys.
  # An S3 object grant WITHOUT the matching key grant is inert: the request
  # fails with AccessDenied naming kms:Decrypt / kms:GenerateDataKey, not S3,
  # which is why it survived a policy-simulator check. This killed B4 preflight
  # attempts 1-3. generate.py DERIVES the key statement from the S3 grants, so
  # a new role cannot be given bucket access and silently lack the key.
  kms:
    data: arn:aws:kms:eu-central-1:558069890522:key/9c336116-c648-4548-95c6-1b926478ae57        # alias/medzen-data
    audio_cache: arn:aws:kms:eu-central-1:558069890522:key/d3c8d8fa-b188-476b-a32b-fb65bebb3bda # alias/medzen-audio
    # Parameter Store is a control-plane data use, so it reuses the data key.
    # The generated role grants constrain decrypt to SSM and this exact path.
    registry: arn:aws:kms:eu-central-1:558069890522:key/9c336116-c648-4548-95c6-1b926478ae57
    # medzen/speech/fish-api-key is CMK-encrypted (verified live 2026-08-22:
    # describe-secret names this key; medzen/tts/dev/* uses the AWS default
    # key). GetSecretValue without kms:Decrypt-via-secretsmanager is inert
    # (B6v2 round 3, Codex) — same derived-grant rule as the buckets.
    secret: arn:aws:kms:eu-central-1:558069890522:key/9c336116-c648-4548-95c6-1b926478ae57
  registry_ssm_prefix: /medzen/registry     # existing app config lives under
                                           # /medzen-health-pro/* and /medzen/tts/* — no collision

  # --- B0 resolved decisions ------------------------------------------------
  network:
    vpc_id: vpc-051aa9df8b64bf141           # DEFAULT VPC — shared with MedZen production
    subnets: [subnet-00232b25bc1ac407a, subnet-05029419c6c61a536, subnet-01fb2fc3f56bce55e]
    subnet_type: public                     # DECISION: option B, revisit before production
    azs: [eu-central-1a, eu-central-1b, eu-central-1c]
    igw: igw-04e2f0034001281e2
    nat: null
    co_tenancy_warning: |
      This VPC also hosts MedZen production: medzen-ehrbase-alb (internet-facing,
      clinical records), cache-proxy-prod/test, and the live medzen-tts-dev
      gateway. 25 ENIs. Any security group or route change here can affect
      production. Private subnets (option A) are the intended end state.

  bedrock:
    # Bare model ids CANNOT be invoked ("on-demand throughput isn't supported").
    # Newer Claude models require an inference profile. Verified 2026-07-29.
    primary_model: eu.anthropic.claude-sonnet-5
    cheap_model: eu.anthropic.claude-haiku-4-5-20251001-v1:0
    routing: eu_cross_region                # routes within EU regions only
    residency_note: EU-wide, not Frankfurt-only. Single-region lock is not
                    available for current Claude models on Bedrock.

# --------------------------------------------------------------------------
# Runtime services (deployed to EKS)
# --------------------------------------------------------------------------
services:

  speech-orchestrator:
    role: The only internet-adjacent service. Owns VAD, language routing,
          session state, the pre-LLM safety gate, streaming backpressure and
          circuit breakers. Calls every other service; is called by MedZen.
    node_pool: cpu
    public: true                       # only service with an ALB route
    image_repo: medzen-orchestrator
    replicas: {min: 2, max: 6}
    hpa: {metric: cpu, target_utilization: 70}
    resources:
      requests: {cpu: "500m", memory: "1Gi"}
      limits:   {cpu: "2",    memory: "2Gi"}
    probes:
      readiness: {path: /readyz, port: 8080, initial_delay: 10, period: 10, failure_threshold: 3}
      liveness:  {path: /healthz, port: 8080, period: 30, failure_threshold: 3}
    pod_identity:
      role_name: medzen-orch-role
      permissions:
        - {actions: [s3:GetObject, s3:PutObject], resource: audio_cache, path: "tts/*"}
        - {actions: [s3:PutObject], resource: audio_cache, path: "user-audio/*"}
        - {actions: [ssm:GetParameter, ssm:GetParametersByPath], resource: registry}
        - {actions: [secretsmanager:GetSecretValue], resource: secret, name: medzen/client-api-keys}
    depends_on: [asr-runtime, llm-gateway, tts-gateway]
    notes: Emergency detection runs here, pre-LLM, with no shed path (A6).

  asr-runtime:
    role: Speech to text. Serves ONE multilingual artifact for all languages
          (ARCH-2026-001); per-language approval lives in the registry, not
          in separate deployments. Default backend is the v0 Whisper/CT2
          platform proof; B6v2 adds the OmniASR fairseq2 backend
          (MEDZEN_ASR_BACKEND=omniasr, Dockerfile.gpu, loader-v2 marker) —
          dark until the b6v2 serving deploy. Either backend loads a
          verifier-approved artifact and reports its VERIFIED classification.
    node_pool: gpu
    public: false
    image_repo: medzen-asr-runtime
    replicas: {min: 1, max: 1}         # fixed — no GPU autoscaling in MVP
    hpa: null
    resources:
      requests: {cpu: "2", memory: "8Gi"}
      limits:   {cpu: "4", memory: "12Gi", "nvidia.com/gpu": 1}
    gpu:
      toleration: {key: "nvidia.com/gpu", operator: Equal, value: "true", effect: NoSchedule}
      node_selector: {workload: gpu}
    probes:
      # 5-minute budget: 6-8 GB image + 30-60s model load. Web-app defaults
      # crash-loop this pod and the cause is not obvious from the events.
      startup:  {path: /readyz, port: 8081, period: 10, failure_threshold: 30}
      liveness: {path: /healthz, port: 8081, period: 30, failure_threshold: 3}
      readiness: {path: /readyz, port: 8081, period: 10, failure_threshold: 3}
    init_container: model-loader
    pod_identity:
      role_name: medzen-asr-role
      permissions:
        - {actions: [s3:GetObject], resource: data, path: "approved/asr/*"}
    notes: Artifact is NOT baked into the image. decode_strategy comes from
           the registry per language (correction 3).

  llm-gateway:
    role: Understanding and response generation. The synthetic fake-Bedrock
          provider remains the closed B6.2 proof; B6v2 adds the REAL Bedrock
          Converse provider (identity bedrock:<model-id>, grounding_text in,
          grounding_sha256 out, blank grounding refused) — live calls remain
          gated on the capped qualification packet. A vLLM Qwen upstream
          stays a later per-language option. Applies the versioned
          per-language policy referenced by the registry.
    node_pool: cpu
    public: false
    image_repo: medzen-llm-gateway
    replicas: {min: 2, max: 4}
    hpa: {metric: cpu, target_utilization: 70}
    resources:
      requests: {cpu: "250m", memory: "512Mi"}
      limits:   {cpu: "1",    memory: "1Gi"}
    probes:
      readiness: {path: /readyz, port: 8082, initial_delay: 5, period: 10, failure_threshold: 3}
      liveness:  {path: /healthz, port: 8082, period: 30, failure_threshold: 3}
    pod_identity:
      role_name: medzen-llm-role
      permissions:
        - {actions: [bedrock:InvokeModel, bedrock:InvokeModelWithResponseStream], resource: bedrock}
        - {actions: [ssm:GetParameter, ssm:GetParametersByPath], resource: registry}
    depends_on: [rag-index]
    notes: Clinical facts stay in RAG, never in weights (A5 invariant). The
           local B6.2 provider has no network or AWS SDK path.

  tts-gateway:
    role: Text to speech. Fish Audio API now; Qwen3-TTS pod later. Owns the
          voice registry, the content-hash cache and the fallback chain.
    node_pool: cpu
    public: false
    image_repo: medzen-speech-tts-gateway
    replicas: {min: 1, max: 3}
    hpa: {metric: cpu, target_utilization: 70}
    resources:
      requests: {cpu: "250m", memory: "512Mi"}
      limits:   {cpu: "1",    memory: "1Gi"}
    probes:
      readiness: {path: /readyz, port: 8080, initial_delay: 5, period: 10, failure_threshold: 3}
      liveness:  {path: /healthz, port: 8080, period: 30, failure_threshold: 3}
    pod_identity:
      role_name: medzen-tts-role
      permissions:
        # BOTH real Fish secrets (the old medzen/fish-api-key matched
        # neither — Codex serving review finding 7)
        - {actions: [secretsmanager:GetSecretValue], resource: secret, name: medzen/speech/fish-api-key}
        - {actions: [secretsmanager:GetSecretValue], resource: secret, name: medzen/tts/dev/fish-api-key}
        # ListBucket (prefix-scoped): without it HeadObject on a missing
        # key returns 403, not 404 — the fail-closed cache would raise on
        # every legitimate MISS instead of synthesizing (B6v2 round 3)
        - {actions: [s3:GetObject, s3:PutObject, s3:ListBucket], resource: audio_cache, path: "tts/*"}
        - {actions: [ssm:GetParameter, ssm:GetParametersByPath], resource: registry}
    existing_code: null            # unrelated project owns medzen-tts-gateway; ours is separate
    notes: Fallback chain Fish -> self-hosted (registry-approved only) -> text-only.

  rag-index:
    role: Retrieval over clinical content. Serves only owner-approved content
          versions; publish and rollback are alias switches.
    node_pool: cpu
    public: false
    image_repo: medzen-rag-index
    replicas: {min: 2, max: 4}
    hpa: {metric: cpu, target_utilization: 70}
    resources:
      requests: {cpu: "500m", memory: "2Gi"}
      limits:   {cpu: "2",    memory: "4Gi"}
    probes:
      readiness: {path: /readyz, port: 8083, initial_delay: 15, period: 10, failure_threshold: 3}
      liveness:  {path: /healthz, port: 8083, period: 30, failure_threshold: 3}
    pod_identity:
      role_name: medzen-rag-role
      permissions:
        - {actions: [s3:GetObject, s3:ListBucket], resource: data, path: "content/*"}
    notes: Index built at image build time; alias switch = publish/rollback.

# --------------------------------------------------------------------------
# Init container — runs inside asr-runtime (and later the Qwen/TTS GPU pods)
# --------------------------------------------------------------------------
init_containers:
  model-loader:
    role: Download the authorized artifact, verify the manifest, every file
          SHA-256 and the artifact-tree SHA-256, write an atomic verification
          marker, then exit 0. It performs no inference and requests no GPU.
          A failure prevents the main container from starting.
    image_repo: medzen-model-loader
    resources:
      requests: {cpu: "500m", memory: "2Gi"}
      limits:   {cpu: "2",    memory: "4Gi"}
    pod_identity:
      role_name: medzen-loader-role
      permissions:
        - {actions: [s3:GetObject], resource: data, path: "approved/*"}

# --------------------------------------------------------------------------
# Offline — NOT in the cluster, NOT reachable from it
# --------------------------------------------------------------------------
offline:
  trainer:
    role: Model factory. Plain Docker so the same image runs on EC2 now and
          SageMaker later (B10) with no change.
    compute: ec2-spot
    instance_type: g6.xlarge           # verify G-family availability in eu-central-1 (B0.4)
    iam_role: medzen-trainer-role
    permissions:
      # READ ONLY, same reasoning as curated/*: training reads source audio from
      # here and writes nothing. An unused write grant is only a way to corrupt
      # the inputs a run claims to have trained on.
      - {actions: [s3:GetObject, s3:ListBucket], resource: data, path: "raw/*"}
      # READ ONLY. Training reads manifests, COMPLETE.json, ADOPTION.json and the
      # deferral policy from here, and every integrity check in the loader is a
      # check against these objects. A job that can rewrite them can rewrite the
      # evidence that authorises it, so the grant it never used is removed and
      # denied below.
      - {actions: [s3:GetObject, s3:ListBucket], resource: data, path: "curated/*"}
      - {actions: [s3:GetObject, s3:ListBucket], resource: data, path: "eval/*"}     # READ ONLY
      # write AND read: a spot resume must fetch the checkpoint it wrote
      - {actions: [s3:GetObject, s3:PutObject], resource: data, path: "candidates/*"}
      - {actions: [s3:ListBucket], resource: data, path: "candidates/*"}
      # MLflow artifacts + the tracking DB must outlive a disposable spot box
      - {actions: [s3:GetObject, s3:PutObject], resource: data, path: "mlflow/*"}
      - {actions: [s3:ListBucket], resource: data, path: "mlflow/*"}
      # Base checkpoints, cached once. READ ONLY: pulling from the Hub on every
      # start is a rate-limitable 3 GB download, but training must never be
      # able to rewrite the base weights it is fine-tuning from.
      - {actions: [s3:GetObject, s3:ListBucket], resource: data, path: "models/*"}
      # Pull the trainer image by digest. READ ONLY, and the deny below makes
      # that structural: a training job must not be able to publish or overwrite
      # the image it is running from.
      - {actions: [ecr:GetAuthorizationToken], resource: "*"}
      - {actions: [ecr:BatchGetImage, ecr:GetDownloadUrlForLayer,
                   ecr:BatchCheckLayerAvailability, ecr:DescribeImages],
         resource: ecr, name: medzen-trainer}
      # T6 gate evaluations run the PINNED eval-runtime image on a trainer-
      # plane box (read eval sets, write research/* results). Pull-only; the
      # A3 wall (no eval-zone writes) is untouched.
      - {actions: [ecr:BatchGetImage, ecr:GetDownloadUrlForLayer,
                   ecr:BatchCheckLayerAvailability, ecr:DescribeImages],
         resource: ecr, name: medzen-asr-eval-runtime}
      # round 13: the dev GPU smoke pulls the SERVING image by digest on
      # the trainer-profile box (pull-only; first smoke failed closed here)
      - {actions: [ecr:BatchGetImage, ecr:GetDownloadUrlForLayer,
                   ecr:BatchCheckLayerAvailability, ecr:DescribeImages],
         resource: ecr, name: medzen-asr-runtime}
    explicit_denies:
      # The isolation SageMaker sells, obtained for free by construction.
      - {actions: ["s3:PutObject", "s3:DeleteObject"], resource: data, path: "eval/*",
         why: "A3 — eval sets are write-denied to training roles by IAM, not by discipline"}
      - {actions: ["secretsmanager:*"], resource: "*",
         why: "training never holds production credentials"}
      - {actions: ["bedrock:*"], resource: "*",
         why: "training plane has no production model access"}
      - {actions: ["s3:PutObject", "s3:DeleteObject"], resource: data, path: "models/*",
         why: "base checkpoints are immutable inputs, write-denied like eval sets"}
      - {actions: ["s3:PutObject", "s3:DeleteObject"], resource: data, path: "raw/*",
         why: "Training reads source audio and never writes it. Write access
               would let a run alter the inputs it reports having used."}
      - {actions: ["s3:PutObject", "s3:DeleteObject"], resource: data, path: "curated/*",
         why: "A training job must not be able to rewrite its own governance. The
               corpus manifests, COMPLETE.json, ADOPTION.json and the deferral
               policy all live here and are exactly what the loader verifies
               against; write access would make those checks self-referential.
               Training writes only to candidates/* and mlflow/*."}
      - {actions: ["ecr:PutImage", "ecr:InitiateLayerUpload", "ecr:UploadLayerPart",
                   "ecr:CompleteLayerUpload", "ecr:BatchDeleteImage"],
         resource: ecr, name: medzen-trainer,
         why: "training must never publish or overwrite the image it runs from"}

  builder:
    role: >-
      Builds the trainer container image and pushes it to ECR. Deliberately
      separate from the trainer, because a training job must not be able to
      overwrite the image it runs from, or any other service's image.
    compute: ec2-on-demand
    instance_type: c7i.2xlarge      # x86; the dev laptop is arm64 and would emulate
    iam_role: medzen-builder-role
    permissions:
      - {actions: [s3:GetObject, s3:ListBucket], resource: data, path: "candidates/bootstrap/*"}
      - {actions: [s3:GetObject, s3:PutObject], resource: data, path: "candidates/build/*"}
      - {actions: [s3:ListBucket], resource: data, path: "candidates/build/*"}
      - {actions: [ecr:GetAuthorizationToken], resource: "*"}
      - {actions: [ecr:BatchCheckLayerAvailability, ecr:InitiateLayerUpload,
                   ecr:UploadLayerPart, ecr:CompleteLayerUpload, ecr:PutImage,
                   ecr:BatchGetImage, ecr:DescribeImages, ecr:DescribeImageScanFindings],
         resource: ecr, name: medzen-trainer}
    explicit_denies:
      # The build plane touches exactly one repository. medzen-tts-gateway
      # belongs to an unrelated project and is not ours to write to.
      - {actions: ["ecr:*"], resource: ecr, name: medzen-tts-gateway,
         why: "unrelated project's repository, explicitly out of scope"}
      - {actions: ["s3:PutObject", "s3:DeleteObject"], resource: data, path: "curated/*",
         why: "the build plane has no business writing corpus data"}
      - {actions: ["secretsmanager:*"], resource: "*",
         why: "image builds never hold production credentials"}
      - {actions: ["bedrock:*"], resource: "*",
         why: "A1 invariant 2 — the build plane has no production model access"}
      - {actions: ["s3:PutObject", "s3:DeleteObject"], resource: data, path: "eval/*",
         why: "A3 — eval sets are write-denied to every offline role, builders included"}
