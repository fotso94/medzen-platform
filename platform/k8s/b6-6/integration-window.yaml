    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/security-groups: sg-0f0f6c66852830013
    alb.ingress.kubernetes.io/manage-backend-security-group-rules: "false"
    alb.ingress.kubernetes.io/subnets: subnet-00232b25bc1ac407a,subnet-05029419c6c61a536,subnet-01fb2fc3f56bce55e
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80}]'
