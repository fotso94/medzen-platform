apiVersion: apps/v1
kind: Deployment
metadata:
  name: asr-runtime
  namespace: medzen
  labels: &asr-deploy-labels
    app.kubernetes.io/name: asr-runtime
    medzen.io/classification: synthetic-integration-only
    medzen.io/serving-label: v0
  annotations: {medzen.io/change-packet: B6-AWS-CHANGE-PACKET-2026-008}
spec:
  replicas: 0
  strategy: {type: Recreate}
  selector: {matchLabels: *asr-deploy-labels}
  template:
    metadata: {labels: *asr-deploy-labels}
    spec:
      serviceAccountName: asr-runtime-b6a
      nodeSelector: {workload: gpu}
      tolerations:
      - {key: nvidia.com/gpu, operator: Equal, value: "true", effect: NoSchedule}
      resourceClaims:
      - {name: gpu, resourceClaimTemplateName: asr-runtime-gpu}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      initContainers:
      - name: model-loader
        image: 558069890522.dkr.ecr.eu-central-1.amazonaws.com/medzen-model-loader@sha256:cb794f2169dc65f391a0c9ec789997ce19a31b38d9087f263fba0863ba0414a5
        imagePullPolicy: IfNotPresent
        envFrom: [{configMapRef: {name: asr-runtime-config}}]
        resources:
          requests: {cpu: 500m, memory: 2Gi}
          limits: {cpu: "2", memory: 4Gi}
        securityContext: &asr-container-security
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities: {drop: [ALL]}
        volumeMounts: [{name: model, mountPath: /models}, {name: tmp, mountPath: /tmp}]
      containers:
      - name: asr-runtime
        image: 558069890522.dkr.ecr.eu-central-1.amazonaws.com/medzen-asr-runtime@sha256:434ac9e757b56949324e9e480490042fcbf35285f27bdee713bd771b502f4087
        imagePullPolicy: IfNotPresent
        envFrom: [{configMapRef: {name: asr-runtime-config}}]
        ports: [{name: http, containerPort: 8081}]
        resources:
          requests: {cpu: "2", memory: 8Gi}
          limits: {cpu: "4", memory: 12Gi}
          claims: [{name: gpu}]
        securityContext: *asr-container-security
        startupProbe: {httpGet: {path: /readyz, port: http}, periodSeconds: 10, failureThreshold: 60}
        readinessProbe: {httpGet: {path: /readyz, port: http}, periodSeconds: 10, failureThreshold: 3}
        livenessProbe: {httpGet: {path: /healthz, port: http}, periodSeconds: 30, failureThreshold: 3}
        volumeMounts: [{name: model, mountPath: /models, readOnly: true}, {name: tmp, mountPath: /tmp}]
      volumes:
      - {name: model, emptyDir: {sizeLimit: 8Gi}}
      - {name: tmp, emptyDir: {sizeLimit: 1Gi}}
---
