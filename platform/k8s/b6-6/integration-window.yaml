  MEDZEN_B6_PROOF_AUDIO_SHA256: 3e7b78cbf65b5b857d0bd2ea6b2568ce74c523be2b319ade8930c9ac6a7630c3
  MEDZEN_B6_RAG_INDEX_SHA256: 6dc2a9217b44a8cd9523ee051f19a7e20d1cab447ad0029a42796c5211797160
---
apiVersion: resource.k8s.io/v1
kind: ResourceClaimTemplate
metadata:
  name: asr-runtime-gpu
  namespace: medzen
spec:
  spec:
    devices:
      requests:
      - name: gpu
        exactly:
          deviceClassName: gpu.nvidia.com
          count: 1
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rag-index
  namespace: medzen
  labels: &rag-labels
    app.kubernetes.io/name: rag-index
    medzen.io/classification: synthetic-integration-only
  annotations:
    medzen.io/change-packet: B6-AWS-CHANGE-PACKET-2026-008
spec:
  replicas: 0
  selector:
    matchLabels: *rag-labels
  template:
    metadata:
      labels: *rag-labels
    spec:
      serviceAccountName: rag-index
      nodeSelector: {workload: cpu}
      securityContext: &pod-security
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
      - name: rag-index
        image: 558069890522.dkr.ecr.eu-central-1.amazonaws.com/medzen-rag-index@sha256:fe4663812f88bd35d520fee3e80450981347c970f2a561eb8163b14183b7194c
        imagePullPolicy: IfNotPresent
        ports: [{name: http, containerPort: 8083}]
        resources:
          requests: {cpu: 250m, memory: 512Mi}
          limits: {cpu: "1", memory: 1Gi}
        securityContext: &container-security
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities: {drop: [ALL]}
        startupProbe: {httpGet: {path: /readyz, port: http}, periodSeconds: 5, failureThreshold: 24}
        readinessProbe: {httpGet: {path: /readyz, port: http}, periodSeconds: 5, failureThreshold: 3}
        livenessProbe: {httpGet: {path: /healthz, port: http}, periodSeconds: 30, failureThreshold: 3}
        volumeMounts: [{name: tmp, mountPath: /tmp}]
      volumes: [{name: tmp, emptyDir: {sizeLimit: 128Mi}}]
---
apiVersion: v1
