apiVersion: v1
kind: Namespace
metadata:
  name: nvidia-dra-driver
  labels:
    medzen.io/classification: offline-evaluation-infrastructure
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: medzen-dra-kubernetes-api-egress
  namespace: nvidia-dra-driver
  labels:
    medzen.io/classification: offline-evaluation-infrastructure
spec:
  podSelector:
    matchLabels:
      dra-driver-nvidia-gpu-component: kubelet-plugin
  policyTypes:
    - Egress
  egress:
    - to:
        - ipBlock:
            cidr: 10.100.0.1/32
      ports:
        - protocol: TCP
          port: 443
