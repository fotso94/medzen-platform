# HAND-AUTHORED topology manifest (task F) — NOT generated by
# platform/generate.py, which is per-service. Base v5 B6 row 2: an
# INTERNAL ALB where ONLY the orchestrator has a route; every model
# service stays ClusterIP and is reachable exclusively inside the
# cluster. The security group admits the MedZen backend only — its id
# is bound at deploy time (PLACEHOLDER, same discipline as image tags:
# a placeholder that survives into a live manifest fails the deploy
# runbook's verification step).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: speech-orchestrator
  namespace: medzen
  annotations:
    alb.ingress.kubernetes.io/scheme: internal
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS": 443}]'
    alb.ingress.kubernetes.io/certificate-arn: PLACEHOLDER_ACM_CERT_ARN
    alb.ingress.kubernetes.io/security-groups: PLACEHOLDER_BACKEND_ONLY_SG
    alb.ingress.kubernetes.io/manage-backend-security-group-rules: "true"
    alb.ingress.kubernetes.io/healthcheck-path: /readyz
    # WebSocket streaming (orchestrator-stream-v1) rides HTTP/1.1 upgrade;
    # idle timeout must exceed the longest permitted stream turn.
    alb.ingress.kubernetes.io/load-balancer-attributes: idle_timeout.timeout_seconds=120
spec:
  ingressClassName: alb
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: speech-orchestrator
                port:
                  number: 8080
