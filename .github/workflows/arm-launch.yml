name: arm-launch
# Protected CALLER (no credentials here): dispatches the reusable
# credential-bearing exec workflow in launch mode. Takes NO inputs.
# Activation notes live in the exec workflow and
# platform/iam/LOCAL-BOUNDARY-RUNBOOK.md (deferred by owner: dev-risk
# accepted). Owner setup: environment arm-launch-approval (self as
# required reviewer; master-only deployment branches — works on the
# now-public repo on any plan) + terraform apply -var
# arm_launch_enabled=true + repo variable MEDZEN_ARM_LAUNCH_ROLE_ARN.
permissions:
  contents: read
  id-token: write
concurrency:
  group: arm-launch
  cancel-in-progress: false
on:
  workflow_dispatch: {}
jobs:
  launch:
    uses: ./.github/workflows/arm-launch-exec.yml
    with:
      mode: launch
