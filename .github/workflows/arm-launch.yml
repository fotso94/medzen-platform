name: arm-launch
# Codex reviews #23-#24. The OWNER's click on this workflow's protected
# environment (arm-launch-approval) is THE authorization event — a
# github.com identity action outside every local trust surface. The
# workflow assumes the DEDICATED medzen-arm-launch-role (environment-
# scoped OIDC subject; never the general CI role) and re-runs every
# committed gate before anything spends.
# DARK until the owner: (1) creates environment arm-launch-approval with
# themselves as required reviewer (deployment branches: master only;
# check plan support for required reviewers on private repos),
# (2) sets repo variable MEDZEN_ARM_LAUNCH_ROLE_ARN after applying the
# infra/iam.tf arm-launch role,
# (3) applies platform/iam/medzen-local-boundary-policy.json so local
# credentials cannot create arm-tier jobs directly.
permissions:
  contents: read
  id-token: write
concurrency:
  group: arm-launch
  cancel-in-progress: false
on:
  workflow_dispatch:
    inputs:
      job_id:
        description: "arm job id — must equal the committed packet's job_id"
        required: true
        type: string
jobs:
  launch:
    runs-on: ubuntu-latest
    environment: arm-launch-approval
    # protected default branch ONLY (Codex review #24: dispatch can
    # target arbitrary refs), and dark until the dedicated role exists
    if: github.ref == 'refs/heads/master' && vars.MEDZEN_ARM_LAUNCH_ROLE_ARN != ''
    env:
      MEDZEN_EXECUTOR: github-protected-workflow
      ARM_PACKET: platform/manifests/B5-UNIVERSAL-ARM1-SAGEMAKER-BINDINGS-2026-005.json
      ARM_REQUEST: platform/manifests/B5-UNIVERSAL-ARM1-REQUEST-2026-005.json
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v5.0.1
        with:
          fetch-depth: 0
      - name: the dispatched job_id must equal the committed packet (BEFORE credentials)
        run: |
          PACKET_JOB=$(python3 -c "import json; print(json.load(open('$ARM_PACKET'))['job_id'])")
          if [ "${{ inputs.job_id }}" != "$PACKET_JOB" ]; then
            echo "dispatched job_id '${{ inputs.job_id }}' != committed packet job_id '$PACKET_JOB'"
            exit 1
          fi
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: install pinned launch dependencies
        run: |
          pip install "boto3==1.40.16" "pyyaml==6.0.2" "jsonschema==4.25.0" "numpy==2.3.2"
          pip install "torch==2.8.0" --index-url https://download.pytorch.org/whl/cpu
      - uses: aws-actions/configure-aws-credentials@a159d7bb5354cf786f855f2f5d1d8d768d9a08d1 # v5.0.0
        with:
          role-to-assume: ${{ vars.MEDZEN_ARM_LAUNCH_ROLE_ARN }}
          aws-region: eu-central-1
      - name: launch under the committed gates
        run: |
          python scripts/b5_sagemaker_job.py launch \
            --bindings "$ARM_PACKET" --request "$ARM_REQUEST"
