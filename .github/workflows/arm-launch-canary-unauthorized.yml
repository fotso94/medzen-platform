name: arm-launch-canary-unauthorized
# NEGATIVE canary #1 (missing job_workflow_ref): direct job, same
# protected environment. Codex review #27 hardening: a missing role
# variable FAILS the run (no silent skip), and the refusal must be an
# explicit STS AccessDenied — an unrelated failure no longer counts as
# success. The raw assume call is made directly so the error code is
# observable.
permissions:
  contents: read
  id-token: write
on:
  workflow_dispatch: {}
jobs:
  must-be-refused:
    runs-on: ubuntu-latest
    environment: arm-launch-approval
    env:
      ROLE_ARN: ${{ vars.MEDZEN_ARM_LAUNCH_ROLE_ARN }}
    steps:
      - name: the role variable must be configured (skipping is not passing)
        run: |
          if [ -z "$ROLE_ARN" ]; then
            echo "MEDZEN_ARM_LAUNCH_ROLE_ARN is not set — refusing to pretend this canary ran"
            exit 1
          fi
      - name: raw assume attempt must yield explicit AccessDenied
        run: |
          OIDC_TOKEN=$(curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | python3 -c "import json,sys; print(json.load(sys.stdin)['value'])")
          set +e
          ERR=$(aws sts assume-role-with-web-identity \
            --role-arn "$ROLE_ARN" \
            --role-session-name canary-unauthorized \
            --web-identity-token "$OIDC_TOKEN" 2>&1)
          RC=$?
          set -e
          if [ $RC -eq 0 ]; then
            echo "TRUST POLICY TOO BROAD: a direct workflow assumed the arm-launch role"
            exit 1
          fi
          echo "$ERR" | grep -q "AccessDenied" || {
            echo "assumption failed but NOT with AccessDenied — inconclusive, failing:"
            echo "$ERR"
            exit 1
          }
          echo "NEGATIVE_CANARY_OK: explicit AccessDenied for the direct workflow"
