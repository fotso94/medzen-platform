# NEGATIVE canary, reusable half (Codex #21 rec 1 / #22 C2 / #23): the token
# carries a REAL (wrong) job_workflow_ref naming THIS file. Codex review #23:
# the probe must run in the SAME protected environment as the real publisher
# job, so the token's sub claim MATCHES the trust and ONLY job_workflow_ref
# differs — otherwise the denial could come from the sub mismatch and prove
# nothing about the workflow-identity restriction. Missing variable FAILS
# (skipping is not passing); only an explicit STS AccessDenied passes.
name: arm2-image-canary-wrongref-exec

permissions:
  contents: read
  id-token: write

on:
  workflow_call: {}

jobs:
  must-be-refused:
    runs-on: ubuntu-24.04
    # same environment as the real publisher job — isolates job_workflow_ref
    environment: trainer-image-publish
    env:
      ROLE_ARN: ${{ vars.MEDZEN_TRAINER_IMAGE_PUBLISHER_ROLE_ARN }}
    steps:
      - name: the role variable must be configured (skipping is not passing)
        run: |
          if [ -z "$ROLE_ARN" ]; then
            echo "MEDZEN_TRAINER_IMAGE_PUBLISHER_ROLE_ARN is not set — refusing to pretend this canary ran"
            exit 1
          fi
      - name: raw assume attempt must yield explicit AccessDenied
        run: |
          OIDC_TOKEN=$(curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | python3 -c "import json,sys; print(json.load(sys.stdin)['value'])")
          set +e
          ERR=$(aws sts assume-role-with-web-identity \
            --role-arn "$ROLE_ARN" \
            --role-session-name arm2-image-canary-wrongref \
            --web-identity-token "$OIDC_TOKEN" 2>&1)
          RC=$?
          set -e
          if [ $RC -eq 0 ]; then
            echo "TRUST POLICY TOO BROAD: a WRONG reusable workflow assumed the trainer-image publisher role"
            exit 1
          fi
          echo "$ERR" | grep -q "AccessDenied" || {
            echo "assumption failed but NOT with AccessDenied — inconclusive, failing:"
            echo "$ERR"
            exit 1
          }
          echo "WRONGREF_NEGATIVE_CANARY_OK: explicit AccessDenied for the wrong job_workflow_ref"
