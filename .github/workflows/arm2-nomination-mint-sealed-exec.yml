# Final activation patch: the SEALED-IDENTITY producer reusable exec. Its
# job_workflow_ref is what medzen-arm2-sealed-identity-role trusts (reads ONLY
# the pinned sealed manifests by VersionId; curated/* + non-sealed eval denied),
# and it runs in the arm2-nomination-mint-sealed environment. It extracts
# audio_checksum_sha256 ONLY, uploads the identity-only authorities, and exports
# their canonical sha as a job output for the same-run handoff to the mint.
name: arm2-nomination-mint-sealed-exec

on:
  workflow_call:
    inputs:
      sha:
        required: true
        type: string
    outputs:
      authorities_sha256:
        description: sha256 of the produced canonical sealed-authorities.json
        value: ${{ jobs.seal.outputs.authorities_sha256 }}

permissions:
  contents: read
  id-token: write

jobs:
  seal:
    runs-on: ubuntu-24.04
    environment: arm2-nomination-mint-sealed
    outputs:
      authorities_sha256: ${{ steps.emit.outputs.authorities_sha256 }}
    steps:
      - name: the sealed role variable must be configured (a skip is not a pass)
        run: |
          if [ -z "${{ vars.MEDZEN_ARM2_SEALED_IDENTITY_ROLE_ARN }}" ]; then
            echo "::error::MEDZEN_ARM2_SEALED_IDENTITY_ROLE_ARN is not set"; exit 1
          fi
      - name: require an exact single-line 40-hex commit
        env:
          SHA: ${{ inputs.sha }}
        run: |
          if [ "$(printf '%s' "$SHA" | wc -l)" -ne 0 ] \
              || ! printf '%s' "$SHA" | grep -Exq '[0-9a-f]{40}'; then
            echo "::error::inputs.sha must be a single exact 40-hex commit"; exit 1
          fi
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v5.0.1
        with:
          ref: ${{ inputs.sha }}
          fetch-depth: 0
      - name: bind runnable code to the trust root — sha MUST equal origin/master HEAD
        env:
          SHA: ${{ inputs.sha }}
        run: |
          git fetch --quiet origin master
          if [ "$SHA" != "$(git rev-parse origin/master)" ]; then
            echo "::error::inputs.sha != origin/master HEAD"; exit 1
          fi
          if [ "$(git rev-parse HEAD)" != "$SHA" ]; then
            echo "::error::checkout HEAD != requested sha"; exit 1
          fi
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: install the HASH-LOCKED dependency closure BEFORE any credentials exist
        run: |
          pip install --require-hashes --only-binary=:all: -r scripts/requirements/arm2-launch.txt
      - name: OIDC federation as the dedicated sealed-identity role
        uses: aws-actions/configure-aws-credentials@a159d7bb5354cf786f855f2f5d1d8d768d9a08d1 # v5.0.0
        with:
          role-to-assume: ${{ vars.MEDZEN_ARM2_SEALED_IDENTITY_ROLE_ARN }}
          aws-region: eu-central-1
      - name: assert the EXACT assumed identity (account + sealed role)
        run: |
          ARN=$(aws sts get-caller-identity --query Arn --output text)
          ACCOUNT=$(aws sts get-caller-identity --query Account --output text)
          if [ "$ACCOUNT" != "558069890522" ]; then echo "::error::wrong account $ACCOUNT"; exit 1; fi
          case "$ARN" in
            "arn:aws:sts::558069890522:assumed-role/medzen-arm2-sealed-identity-role/"*) ;;
            *) echo "::error::assumed role $ARN is not medzen-arm2-sealed-identity-role"; exit 1 ;;
          esac
      - name: produce the identity-only sealed authorities (checksums only)
        run: |
          PYTHONPATH=scripts python scripts/build_arm2_sealed_identity_index.py --live
      - name: export the canonical authorities sha256 (same-run handoff bind)
        id: emit
        run: |
          SHA256=$(python3 -c "import hashlib; print(hashlib.sha256(open('sealed-authorities.json','rb').read()).hexdigest())")
          echo "authorities_sha256=$SHA256" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sealed-authorities
          path: sealed-authorities.json
          retention-days: 7
