# B6v2 round 13 (Codex): CI builds, scans and produces SBOMs for the
# EXACT images the promotion path runs — the model-loader image (the
# trust boundary that bakes the public key and the scorer) and the GPU
# serving image (Dockerfile.gpu, which _service-pipeline never built).
#
# Every leg is offline (no credentials): build linux/amd64 -> fail-closed
# Trivy scan on fixable CRITICAL/HIGH -> CycloneDX SBOM artifact ->
# image digest recorded. Pushing by digest with a provenance attestation
# (mode=max) is gated on the CI role variable like every AWS-touching job.

name: model-images

on:
  push:
    branches: [master]
    paths:
      - services/model-loader/**
      - services/asr-runtime/**
      - services/asr-eval-runtime/**
      - platform/decisions/PROMOTION-SIGNING-PUBLIC-KEY.pem
      - .github/workflows/model-images.yml
  pull_request:
    paths:
      - services/model-loader/**
      - services/asr-runtime/**
      - services/asr-eval-runtime/**
      - platform/decisions/PROMOTION-SIGNING-PUBLIC-KEY.pem
      - .github/workflows/model-images.yml
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  build-scan-sbom:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: model-loader
            dockerfile: services/model-loader/Dockerfile
            ecr_repository: medzen-model-loader
            free_disk: "false"
          - name: asr-runtime-gpu
            dockerfile: services/asr-runtime/Dockerfile.gpu
            ecr_repository: medzen-asr-runtime
            free_disk: "true"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v5.0.1
      - name: reclaim runner disk for the CUDA image
        if: matrix.free_disk == 'true'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af >/dev/null 2>&1 || true
          df -h / | tail -1
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - name: build linux/amd64 image
        id: build
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          build-args: |
            SOURCE_COMMIT=${{ github.sha }}
          platforms: linux/amd64
          load: true
          tags: ${{ matrix.name }}:ci-${{ github.sha }}
      - name: fail-closed vulnerability scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ matrix.name }}:ci-${{ github.sha }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          format: table
          # the GPU image is ~20GB — the 5m default deadline cannot walk it
          timeout: 30m
      - name: CycloneDX SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ matrix.name }}:ci-${{ github.sha }}
          format: cyclonedx
          output: sbom-${{ matrix.name }}-${{ github.sha }}.cdx.json
          timeout: 30m
      - name: record the built image identity
        run: |
          docker image inspect "${{ matrix.name }}:ci-${{ github.sha }}" \
            --format '{{.Id}} {{.Size}}' > image-identity-${{ matrix.name }}.txt
          cat image-identity-${{ matrix.name }}.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sbom-${{ matrix.name }}
          path: |
            sbom-${{ matrix.name }}-${{ github.sha }}.cdx.json
            image-identity-${{ matrix.name }}.txt
          if-no-files-found: error

  # Codex review #14 finding 3: the offline build-scan-sbom job above is
  # the PR gate. On master, this job BUILDS ONCE, pushes that single
  # manifest to a QUARANTINE tag, scans the pushed repo@digest, and only
  # then promotes the EXACT scanned manifest to the release tag (no
  # rebuild). The released digest is therefore always the scanned digest.

  publish:
    needs: build-scan-sbom
    if: vars.MEDZEN_IMAGE_PUBLISHER_ROLE_ARN != '' && github.ref == 'refs/heads/master'
    uses: ./.github/workflows/model-images-publish.yml
    with:
      sha: ${{ github.sha }}
