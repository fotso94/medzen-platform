name: arm-launch-canary-wrongref
# Caller for the wrong-ref negative canary: dispatches a DIFFERENT
# reusable workflow than the one the role trusts, proving the
# job_workflow_ref condition rejects real-but-wrong workflow
# identities, not merely absent claims.
permissions:
  contents: read
  id-token: write
on:
  workflow_dispatch: {}
jobs:
  probe:
    uses: ./.github/workflows/arm-launch-canary-wrongref-exec.yml
