# B7 Phase 2 — infrastructure pipeline (Base v5 B7).
#
# terraform plan on PR -> human review -> apply on merge to the protected
# branch -> nightly drift check. The apply job runs inside the
# "infrastructure" environment whose required-reviewer rule IS the manual
# approval — approval lives in configuration, not convention.
#
# Ships dark like the application pipelines: every job that needs AWS
# credentials is gated on MEDZEN_CI_ROLE_ARN. Until the CI-role packet
# lands, only the offline fmt/validate job runs.

name: infra-pipeline

on:
  pull_request:
    branches: [main]
    paths: ["infra/**"]
  push:
    branches: [main]
    paths: ["infra/**"]
  schedule:
    - cron: "17 3 * * *" # nightly drift check

permissions:
  contents: read
  id-token: write

env:
  TF_IN_AUTOMATION: "1"
  TERRAFORM_VERSION: "1.5.7" # matches infra/providers.tf >= 1.5.0 and the reviewed local apply chain

jobs:
  fmt-validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v5.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v3.1.2
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
      - name: formatting is canonical
        run: terraform -chdir=infra fmt -check -recursive
      - name: configuration validates offline
        run: |
          terraform -chdir=infra init -backend=false -input=false
          terraform -chdir=infra validate

  plan:
    needs: fmt-validate
    if: github.event_name == 'pull_request' && vars.MEDZEN_CI_ROLE_ARN != ''
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      pull-requests: write # posts the plan for the human reviewer
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v5.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v3.1.2
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
      - name: OIDC federation (no static keys)
        uses: aws-actions/configure-aws-credentials@a159d7bb5354cf786f855f2f5d1d8d768d9a08d1 # v5.0.0
        with:
          role-to-assume: ${{ vars.MEDZEN_CI_ROLE_ARN }}
          aws-region: eu-central-1
      - name: plan
        id: plan
        run: |
          terraform -chdir=infra init -input=false
          terraform -chdir=infra plan -input=false -no-color -out=tfplan \
            | tee plan.txt
      - name: publish the plan on the PR
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('plan.txt', 'utf8').slice(0, 60000);
            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: context.issue.number,
              body: ['## terraform plan', '```', plan, '```',
                     '_Apply happens only on merge, inside the protected infrastructure environment._'].join('\n'),
            });

  apply:
    needs: fmt-validate
    if: github.event_name == 'push' && vars.MEDZEN_CI_ROLE_ARN != ''
    runs-on: ubuntu-24.04
    environment: infrastructure # required-reviewer rule = the manual approval
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v5.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v3.1.2
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
      - name: OIDC federation (no static keys)
        uses: aws-actions/configure-aws-credentials@a159d7bb5354cf786f855f2f5d1d8d768d9a08d1 # v5.0.0
        with:
          role-to-assume: ${{ vars.MEDZEN_CI_ROLE_ARN }}
          aws-region: eu-central-1
      - name: apply exactly what merged
        run: |
          terraform -chdir=infra init -input=false
          terraform -chdir=infra apply -input=false -auto-approve

  drift:
    if: github.event_name == 'schedule' && vars.MEDZEN_CI_ROLE_ARN != ''
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      issues: write # a drift finding must become a visible work item
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v5.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v3.1.2
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
      - name: OIDC federation (no static keys)
        uses: aws-actions/configure-aws-credentials@a159d7bb5354cf786f855f2f5d1d8d768d9a08d1 # v5.0.0
        with:
          role-to-assume: ${{ vars.MEDZEN_CI_ROLE_ARN }}
          aws-region: eu-central-1
      - name: detect drift
        id: drift
        run: |
          terraform -chdir=infra init -input=false
          set +e
          terraform -chdir=infra plan -input=false -no-color -detailed-exitcode -out=driftplan | tee drift.txt
          echo "code=$?" >> "$GITHUB_OUTPUT"
      - name: open an issue on drift
        if: steps.drift.outputs.code == '2'
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('drift.txt', 'utf8').slice(0, 60000);
            await github.rest.issues.create({
              ...context.repo,
              title: `infrastructure drift detected ${new Date().toISOString().slice(0,10)}`,
              body: ['Nightly drift check found live state diverging from infra/:',
                     '```', plan, '```'].join('\n'),
            });
      - name: fail the run so drift is loud
        if: steps.drift.outputs.code != '0'
        run: exit 1
