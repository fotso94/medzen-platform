# Codex review #21 F1: the REUSABLE, credential-bearing half of the Arm-2
# trainer-image build. Split out (mirroring the proven model-images-publish.yml
# structure) so the dedicated publisher role's trust can bind job_workflow_ref
# to THIS file — job_workflow_ref is the documented claim for jobs that run
# inside a reusable workflow, so the caller/reusable split removes any
# ambiguity about the claim's presence on ordinary top-level jobs.
#
# The caller (arm2-trainer-image.yml) fails LOUDLY when the role variable is
# absent (Codex #21 F2: a silent green skip is not a pass) and forwards the
# exact reviewed commit. This executor then:
#   1. requires the sha to be exactly 40-hex;
#   2. proves the commit is ON master (ancestor gate — only reviewed,
#      pushed-to-master commits are buildable);
#   3. proves the checkout equals it — all BEFORE credentials;
#   4. builds --target trainer-test (in-image distillation + calibration
#      tests + the fairseq2 contact-surface check; a failure fails the build);
#   5. builds the FINAL image from the same commit, pushes to quarantine,
#      scans the pushed digest fail-closed, attaches SBOM + max provenance;
#   6. promotes the EXACT scanned manifest and prints the digest to pin.
#
# canary=true stops after the role assumption + caller-identity print: the
# POSITIVE OIDC canary (proves the trust binding works) without a 40-minute
# build. The negative canary lives in arm2-image-canary-wrongref-exec.yml.
name: arm2-trainer-image-publish

on:
  workflow_call:
    inputs:
      sha:
        description: exact 40-hex reviewed commit (must be on master)
        required: true
        type: string
      canary:
        description: stop after the OIDC role assumption (positive trust canary)
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

env:
  # inputs.sha reaches shell ONLY as this quoted env var, never inline in a run
  SHA: ${{ inputs.sha }}
  REGISTRY: 558069890522.dkr.ecr.eu-central-1.amazonaws.com
  ECR_REPOSITORY: medzen-trainer-omniasr
  DOCKERFILE: pipeline/Dockerfile.trainer-omniasr

jobs:
  build-test-scan-publish:
    runs-on: ubuntu-24.04
    steps:
      - name: the role variable must be configured (skipping is not passing)
        run: |
          if [ -z "${{ vars.MEDZEN_TRAINER_IMAGE_PUBLISHER_ROLE_ARN }}" ]; then
            echo "::error::MEDZEN_TRAINER_IMAGE_PUBLISHER_ROLE_ARN is not set — failing loudly instead of green-skipping"
            exit 1
          fi
      # (0) exact-commit gate BEFORE anything else — fail loudly on a branch,
      # tag, short sha or injected text
      - name: require an exact single-line 40-hex commit
        run: |
          # strict single-line anchoring (round-20 adversary hardening): a
          # multiline value whose first line is 40-hex must NOT pass
          if [ "$(printf '%s' "$SHA" | wc -l)" -ne 0 ] \
              || ! printf '%s' "$SHA" | grep -Exq '[0-9a-f]{40}'; then
            echo "::error::inputs.sha must be a single exact 40-hex commit"
            exit 1
          fi
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v5.0.1
        with:
          ref: ${{ inputs.sha }}
          fetch-depth: 0
      # (1) the commit must be ON master (reviewed history), and the working
      # tree must BE that commit — both proven BEFORE credentials exist
      - name: verify the commit is on master and the checkout equals it (pre-credential)
        run: |
          git fetch --quiet origin master
          if ! git merge-base --is-ancestor "$SHA" origin/master; then
            echo "::error::$SHA is not on origin/master — only reviewed master commits are buildable"
            exit 1
          fi
          HEAD_OID="$(git rev-parse HEAD)"
          if [ "$HEAD_OID" != "$SHA" ]; then
            echo "::error::checkout HEAD $HEAD_OID != requested $SHA"
            exit 1
          fi
          echo "checkout verified at $HEAD_OID (on master)"
      - name: reclaim runner disk for the CUDA image
        if: ${{ !inputs.canary }}
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af >/dev/null 2>&1 || true
      - name: OIDC federation as the DEDICATED non-deploy trainer-image publisher role
        uses: aws-actions/configure-aws-credentials@a159d7bb5354cf786f855f2f5d1d8d768d9a08d1 # v5.0.0
        with:
          role-to-assume: ${{ vars.MEDZEN_TRAINER_IMAGE_PUBLISHER_ROLE_ARN }}
          aws-region: eu-central-1
      - name: positive canary — print the assumed identity and stop
        if: ${{ inputs.canary }}
        run: |
          aws sts get-caller-identity
          echo "POSITIVE_CANARY_OK: the reusable executor assumed the trainer-image publisher role"
      - name: login to ECR
        if: ${{ !inputs.canary }}
        uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64 # v2.1.6
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
        if: ${{ !inputs.canary }}

      # (2) in-image gate: --target trainer-test runs the distillation +
      # calibration tests + fairseq2 contract INSIDE the image; push:false so
      # the test stage never ships. A failing test fails the build.
      - name: build --target trainer-test (in-image tests, must pass)
        if: ${{ !inputs.canary }}
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: ${{ env.DOCKERFILE }}
          target: trainer-test
          platforms: linux/amd64
          push: false
          load: false

      # (3) the final runtime image from the SAME commit, pushed to a
      # quarantine tag so the scan runs on the exact bytes that ship
      - name: build the FINAL image and push to the quarantine tag
        if: ${{ !inputs.canary }}
        id: build
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: ${{ env.DOCKERFILE }}
          platforms: linux/amd64
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ env.REGISTRY }}/${{ env.ECR_REPOSITORY }}:quarantine-${{ inputs.sha }}

      # (4) fail-closed scan of the PUSHED digest (not a rebuild)
      - name: fail-closed vulnerability scan of the pushed digest
        if: ${{ !inputs.canary }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ env.REGISTRY }}/${{ env.ECR_REPOSITORY }}@${{ steps.build.outputs.digest }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          format: table
          timeout: 30m

      # (5) promote the EXACT scanned manifest (no rebuild) and surface the
      # digest to pin. inputs.sha reaches shell only via the quoted $SHA env.
      - name: promote the scanned manifest and print the digest to pin
        if: ${{ !inputs.canary }}
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          RELEASE_TAG="arm2-ftcal-${SHA}"
          docker buildx imagetools create \
            --tag "${REGISTRY}/${ECR_REPOSITORY}:${RELEASE_TAG}" \
            "${REGISTRY}/${ECR_REPOSITORY}@${DIGEST}"
          PINNED="${REGISTRY}/${ECR_REPOSITORY}@${DIGEST}"
          echo "image_uri_with_digest to pin: ${PINNED}"
          {
            echo "## Arm-2 trainer image published"
            echo ""
            echo "- in-image trainer-test stage: PASSED (distillation + calibration tests + fairseq2 contract)"
            echo "- scanned digest (CRITICAL/HIGH, fail-closed): PASSED"
            echo "- release tag: ${ECR_REPOSITORY}:${RELEASE_TAG}"
            echo ""
            echo "Pin into B5-UNIVERSAL-ARM2-FTCAL-SAGEMAKER-BINDINGS-2026-001.json:"
            echo '```'
            echo "\"image_uri_with_digest\": \"${PINNED}\","
            echo "\"image_oci_index_digest\": \"${PINNED}\""
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
