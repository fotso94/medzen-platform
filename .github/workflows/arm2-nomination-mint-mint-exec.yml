# Codex round 36: the MINT reusable exec. Its job_workflow_ref is what
# medzen-arm2-nomination-mint-role trusts (the 7 pinned reads only), and it runs
# in the arm2-nomination-mint-mint environment — DISTINCT env AND distinct ref
# from the producer, so the two roles are isolated (F3). It downloads the
# same-run producer artifact, binds it to the producer's exported sha (A13), and
# runs the REAL end-to-end mint CLI (F4). It FAILS CLOSED today because the
# admission ledgers ship PENDING — but through the full live_mint chain.
name: arm2-nomination-mint-mint-exec

on:
  workflow_call:
    inputs:
      sha:
        required: true
        type: string
      producer_artifact_sha256:
        required: true
        type: string
      sealed_authorities_sha256:
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  mint:
    runs-on: ubuntu-24.04
    environment: arm2-nomination-mint-mint
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: the mint role variable must be configured (a skip is not a pass)
        run: |
          if [ -z "${{ vars.MEDZEN_ARM2_NOMINATION_MINT_ROLE_ARN }}" ]; then
            echo "::error::MEDZEN_ARM2_NOMINATION_MINT_ROLE_ARN is not set"; exit 1
          fi
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v5.0.1
        with:
          ref: ${{ inputs.sha }}
          fetch-depth: 0
      - name: bind runnable code to the trust root — sha MUST equal origin/master HEAD (A9)
        env:
          SHA: ${{ inputs.sha }}
        run: |
          git fetch --quiet origin master
          HEAD_MASTER="$(git rev-parse origin/master)"
          if [ "$SHA" != "$HEAD_MASTER" ]; then
            echo "::error::inputs.sha $SHA != origin/master HEAD $HEAD_MASTER"; exit 1
          fi
          if [ "$(git rev-parse HEAD)" != "$SHA" ]; then
            echo "::error::checkout HEAD != requested sha"; exit 1
          fi
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: install the HASH-LOCKED dependency closure BEFORE any credentials exist
        run: |
          pip install --require-hashes --only-binary=:all: -r scripts/requirements/arm2-launch.txt
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: training-identity-index
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: sealed-authorities
      - name: bind both downloaded artifacts to the producers' exported shas (same-run handoff)
        env:
          WANT_TI: ${{ inputs.producer_artifact_sha256 }}
          WANT_SA: ${{ inputs.sealed_authorities_sha256 }}
        run: |
          GOT_TI=$(python3 -c "import hashlib; print(hashlib.sha256(open('training-identity-index.json','rb').read()).hexdigest())")
          GOT_SA=$(python3 -c "import hashlib; print(hashlib.sha256(open('sealed-authorities.json','rb').read()).hexdigest())")
          if [ "$GOT_TI" != "$WANT_TI" ]; then
            echo "::error::downloaded training index sha $GOT_TI != producer output $WANT_TI"; exit 1
          fi
          if [ "$GOT_SA" != "$WANT_SA" ]; then
            echo "::error::downloaded sealed authorities sha $GOT_SA != sealed producer output $WANT_SA"; exit 1
          fi
      - name: OIDC federation as the dedicated nomination-mint role
        uses: aws-actions/configure-aws-credentials@a159d7bb5354cf786f855f2f5d1d8d768d9a08d1 # v5.0.0
        with:
          role-to-assume: ${{ vars.MEDZEN_ARM2_NOMINATION_MINT_ROLE_ARN }}
          aws-region: eu-central-1
      - name: assert the EXACT assumed identity (account + mint role)
        run: |
          ARN=$(aws sts get-caller-identity --query Arn --output text)
          ACCOUNT=$(aws sts get-caller-identity --query Account --output text)
          if [ "$ACCOUNT" != "558069890522" ]; then echo "::error::wrong account $ACCOUNT"; exit 1; fi
          case "$ARN" in
            "arn:aws:sts::558069890522:assumed-role/medzen-arm2-nomination-mint-role/"*) ;;
            *) echo "::error::assumed role $ARN is not medzen-arm2-nomination-mint-role"; exit 1 ;;
          esac
      - name: run the REAL end-to-end mint (fails closed while the ledgers are PENDING)
        env:
          GITHUB_SHA: ${{ inputs.sha }}
        run: |
          # loads committed index + both admission ledgers (git HEAD), builds the
          # role-scoped reader, calls live_mint(), writes the hash-bound result.
          # Today it refuses because the ledgers are PENDING — the designed,
          # reviewed terminal state, reached through the full executable path.
          PYTHONPATH=scripts python scripts/mint_arm2_nomination_split.py --live \
            --training-index training-identity-index.json \
            --sealed-authorities sealed-authorities.json \
            --out nomination-split-result.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ success() }}
        with:
          name: nomination-split-result
          path: nomination-split-result.json
          retention-days: 7
      # EXTERNAL artifact attestation (Codex #5): a GitHub-signed build
      # provenance attestation over the exact emitted result bytes. This is the
      # durable, externally-verifiable record (the 7-day artifact is not the
      # record of truth); the result also binds commit_oid + running_script (as
      # committed at the OID) + trust_manifest + artifact_sha256.
      # OWNER: verify this action pin against the published release before the
      # first live run (added offline; the sha could not be network-verified).
      - name: externally attest the frozen result (GitHub build provenance)
        if: ${{ success() }}
        uses: actions/attest-build-provenance@c074443f1aee8d4aeeae555aebba3282517141b2 # v2.2.3 — OWNER: verify this sha
        with:
          subject-path: nomination-split-result.json
