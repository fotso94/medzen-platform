# B7 application pipeline instance for asr-runtime (generated pattern, edited by review).
name: app-asr-runtime
on:
  push:
    branches: [master]
    paths:
      - "services/asr-runtime/**"
      - "platform/services.yaml"
      - ".github/workflows/_service-pipeline.yml"
      - ".github/workflows/app-asr-runtime.yml"
      # B6v2 round 3 (Codex): the suite files themselves and the shared
      # contract/fixture trees must retrigger this pipeline too
      - "tests/test_asr_runtime.py"
      - "tests/test_asr_eval_runtime.py"
      - "platform/contracts/**"
      - "platform/generated/registry-ssm/**"
permissions:
  contents: read
  id-token: write
jobs:
  pipeline:
    uses: ./.github/workflows/_service-pipeline.yml
    with:
      service: asr-runtime
      context_path: services/asr-runtime
      test_paths: "tests/test_asr_runtime.py tests/test_asr_eval_runtime.py"
      ecr_repository: medzen-asr-runtime
      k8s_deployment: asr-runtime
