# B6v2 round 3 (Codex): the model-loader is not a deployed service in
# platform/services.yaml (its image is a verification tool, dark until
# b6v2 activation), so no app pipeline instance exists for it — and its
# tests ran in NO workflow at all. This job runs them on every change to
# the loader or its tests. No AWS, no OIDC token.
name: model-loader-tests
permissions:
  contents: read
on:
  push:
    paths:
      - "services/model-loader/**"
      - "tests/test_model_loader.py"
      - "tests/test_b6v2_real_provider.py"
      - ".github/workflows/model-loader-tests.yml"
  pull_request:
    paths:
      - "services/model-loader/**"
      - "tests/test_model_loader.py"
      - "tests/test_b6v2_real_provider.py"
      - ".github/workflows/model-loader-tests.yml"
jobs:
  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v5.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: install loader pins + test extras
        run: >
          python -m pip install -r services/model-loader/requirements.txt
          "pytest==9.1.1" "PyYAML==6.0.3" "jsonschema==4.26.0"
      - name: model-loader tests
        run: >
          python -m pytest -q tests/test_model_loader.py
          "tests/test_b6v2_real_provider.py::test_loader_v2_accepts_the_multilingual_artifact_shape"
          "tests/test_b6v2_real_provider.py::test_loader_v2_refuses_production_binding_without_gate_approval"
          "tests/test_b6v2_real_provider.py::test_loader_v2_production_needs_committed_promotion_not_manifest_fields"
