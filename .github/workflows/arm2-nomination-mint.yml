# Codex round 36 (F3/A8/A13/A15): CALLER for the Arm-2 nomination mint. It runs
# the PRODUCER exec then the MINT exec as two `uses:` jobs (mint needs
# producer), each federating as its OWN dedicated role via its OWN reusable
# workflow (distinct job_workflow_ref) in its OWN protected environment
# (distinct sub). The caller carries NO workflow-level id-token:write (A15) —
# the preflight never federates; id-token is granted only to the two `uses:`
# jobs. The preflight refuses unless BOTH protected environments already exist
# WITH the owner as required reviewer.
name: arm2-nomination-mint

on:
  workflow_dispatch:
    inputs:
      sha:
        description: exact 40-hex reviewed commit to run from (MUST equal origin/master HEAD)
        required: true
        type: string
      confirm_mint:
        description: pass MINT to attempt the frozen mint after producing the training index; anything else runs the producer only
        required: false
        type: string
        default: ""

permissions:
  contents: read
  id-token: write

jobs:
  preflight:
    runs-on: ubuntu-24.04
    steps:
      - name: both role variables must be present (a skip is not a pass)
        run: |
          if [ -z "${{ vars.MEDZEN_ARM2_TRAINING_INDEX_ROLE_ARN }}" ] \
              || [ -z "${{ vars.MEDZEN_ARM2_NOMINATION_MINT_ROLE_ARN }}" ]; then
            echo "::error::MEDZEN_ARM2_TRAINING_INDEX_ROLE_ARN and MEDZEN_ARM2_NOMINATION_MINT_ROLE_ARN must both be set. Apply infra/arm2_nomination_mint_role.tf (arm2_nomination_mint_enabled=true) and set the repo variables."
            exit 1
          fi
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v5.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: BOTH protected environments must exist WITH owner approval
        run: |
          set -euo pipefail
          for ENV in arm2-nomination-mint-producer arm2-nomination-mint-mint; do
            curl -sSf "https://api.github.com/repos/${{ github.repository }}/environments/$ENV" \
              -o "$ENV.json" || echo '{"__missing__":true}' > "$ENV.json"
          done
          python scripts/verify_protected_environments.py --only-supplied \
            --environment arm2-nomination-mint-producer=arm2-nomination-mint-producer.json \
            --environment arm2-nomination-mint-mint=arm2-nomination-mint-mint.json

  produce:
    needs: preflight
    uses: ./.github/workflows/arm2-nomination-mint-producer-exec.yml
    with:
      sha: ${{ inputs.sha }}

  mint:
    needs: produce
    if: ${{ inputs.confirm_mint == 'MINT' }}
    uses: ./.github/workflows/arm2-nomination-mint-mint-exec.yml
    with:
      sha: ${{ inputs.sha }}
      producer_artifact_sha256: ${{ needs.produce.outputs.artifact_sha256 }}
