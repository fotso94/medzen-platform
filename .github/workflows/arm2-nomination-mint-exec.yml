# Codex round 35 scope 5: the reusable, credential-bearing exec for the Arm-2
# nomination mint. Its job_workflow_ref is what BOTH dedicated roles trust
# (medzen-arm2-training-index-role for the producer job,
# medzen-arm2-nomination-mint-role for the mint job), and every job runs in
# the owner-approved `arm2-nomination-mint` environment, so a human gates
# every run. Hardening mirrors arm2-calibration-launch-exec.yml:
#   - an exact 40-hex reviewed commit, verified on master BEFORE credentials;
#   - HASH-LOCKED dependency closure installed BEFORE credentials exist;
#   - each job assumes ONLY its own role and asserts the EXACT account+role;
#   - the producer emits an IDENTITY-ONLY artifact (counts + aggregate to the
#     log; identities only in the uploaded artifact file);
#   - the mint job runs ONLY when confirm_mint == MINT, and today FAILS
#     CLOSED by design: the sealed identity-only exclusion authorities
#     require separate owner ledger adjudication (live-mint packet) — until
#     they exist no FROZEN mint is possible, and this exec proves the
#     refusal path end-to-end rather than minting anything.
name: arm2-nomination-mint-exec

on:
  workflow_call:
    inputs:
      sha:
        description: exact 40-hex reviewed commit to run from (must be on master)
        required: true
        type: string
      confirm_mint:
        description: pass the literal MINT to attempt the frozen mint (else producer only)
        required: false
        type: string
        default: ""

permissions:
  contents: read
  id-token: write

env:
  SHA: ${{ inputs.sha }}

jobs:
  training-index:
    runs-on: ubuntu-24.04
    environment: arm2-nomination-mint
    steps:
      - name: the producer role variable must be configured (a skip is not a pass)
        run: |
          if [ -z "${{ vars.MEDZEN_ARM2_TRAINING_INDEX_ROLE_ARN }}" ]; then
            echo "::error::MEDZEN_ARM2_TRAINING_INDEX_ROLE_ARN is not set — apply infra/arm2_nomination_mint_role.tf and set the repo variable"
            exit 1
          fi
      - name: require an exact single-line 40-hex commit
        run: |
          if [ "$(printf '%s' "$SHA" | wc -l)" -ne 0 ] \
              || ! printf '%s' "$SHA" | grep -Exq '[0-9a-f]{40}'; then
            echo "::error::inputs.sha must be a single exact 40-hex commit"
            exit 1
          fi
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v5.0.1
        with:
          ref: ${{ inputs.sha }}
          fetch-depth: 0
      - name: verify the commit is on master and the checkout equals it (pre-credential)
        run: |
          git fetch --quiet origin master
          if ! git merge-base --is-ancestor "$SHA" origin/master; then
            echo "::error::$SHA is not on origin/master — only reviewed master commits may run"
            exit 1
          fi
          HEAD_OID="$(git rev-parse HEAD)"
          if [ "$HEAD_OID" != "$SHA" ]; then
            echo "::error::checkout HEAD $HEAD_OID != requested $SHA"
            exit 1
          fi
          echo "checkout verified at $HEAD_OID (on master)"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: install the HASH-LOCKED dependency closure BEFORE any credentials exist
        run: |
          pip install --require-hashes --only-binary=:all: -r scripts/requirements/arm2-launch.txt
      - name: OIDC federation as the dedicated training-index role
        uses: aws-actions/configure-aws-credentials@a159d7bb5354cf786f855f2f5d1d8d768d9a08d1 # v5.0.0
        with:
          role-to-assume: ${{ vars.MEDZEN_ARM2_TRAINING_INDEX_ROLE_ARN }}
          aws-region: eu-central-1
      - name: assert the EXACT assumed identity (account + producer role)
        run: |
          IDENTITY=$(aws sts get-caller-identity --output json)
          ACCOUNT=$(printf '%s' "$IDENTITY" | python3 -c "import json,sys; print(json.load(sys.stdin)['Account'])")
          ARN=$(printf '%s' "$IDENTITY" | python3 -c "import json,sys; print(json.load(sys.stdin)['Arn'])")
          if [ "$ACCOUNT" != "558069890522" ]; then
            echo "::error::assumed account $ACCOUNT != 558069890522"; exit 1
          fi
          case "$ARN" in
            "arn:aws:sts::558069890522:assumed-role/medzen-arm2-training-index-role/"*) ;;
            *) echo "::error::assumed role ARN $ARN is not medzen-arm2-training-index-role"; exit 1 ;;
          esac
          echo "identity OK: account 558069890522, role medzen-arm2-training-index-role"
      - name: produce the training identity index (identities only; hash-chained to the adoption records)
        run: |
          cd "$GITHUB_WORKSPACE"
          PYTHONPATH=scripts python scripts/build_arm2_training_identity_index.py --live
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: training-identity-index
          path: training-identity-index.json
          retention-days: 7

  mint:
    needs: training-index
    if: ${{ inputs.confirm_mint == 'MINT' }}
    runs-on: ubuntu-24.04
    environment: arm2-nomination-mint
    steps:
      - name: the mint role variable must be configured (a skip is not a pass)
        run: |
          if [ -z "${{ vars.MEDZEN_ARM2_NOMINATION_MINT_ROLE_ARN }}" ]; then
            echo "::error::MEDZEN_ARM2_NOMINATION_MINT_ROLE_ARN is not set — apply infra/arm2_nomination_mint_role.tf and set the repo variable"
            exit 1
          fi
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v5.0.1
        with:
          ref: ${{ inputs.sha }}
          fetch-depth: 0
      - name: verify the commit is on master and the checkout equals it (pre-credential)
        run: |
          git fetch --quiet origin master
          if ! git merge-base --is-ancestor "$SHA" origin/master; then
            echo "::error::$SHA is not on origin/master"; exit 1
          fi
          if [ "$(git rev-parse HEAD)" != "$SHA" ]; then
            echo "::error::checkout does not equal the requested commit"; exit 1
          fi
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: install the HASH-LOCKED dependency closure BEFORE any credentials exist
        run: |
          pip install --require-hashes --only-binary=:all: -r scripts/requirements/arm2-launch.txt
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: training-identity-index
      - name: OIDC federation as the dedicated nomination-mint role
        uses: aws-actions/configure-aws-credentials@a159d7bb5354cf786f855f2f5d1d8d768d9a08d1 # v5.0.0
        with:
          role-to-assume: ${{ vars.MEDZEN_ARM2_NOMINATION_MINT_ROLE_ARN }}
          aws-region: eu-central-1
      - name: assert the EXACT assumed identity (account + mint role)
        run: |
          IDENTITY=$(aws sts get-caller-identity --output json)
          ACCOUNT=$(printf '%s' "$IDENTITY" | python3 -c "import json,sys; print(json.load(sys.stdin)['Account'])")
          ARN=$(printf '%s' "$IDENTITY" | python3 -c "import json,sys; print(json.load(sys.stdin)['Arn'])")
          if [ "$ACCOUNT" != "558069890522" ]; then
            echo "::error::assumed account $ACCOUNT != 558069890522"; exit 1
          fi
          case "$ARN" in
            "arn:aws:sts::558069890522:assumed-role/medzen-arm2-nomination-mint-role/"*) ;;
            *) echo "::error::assumed role ARN $ARN is not medzen-arm2-nomination-mint-role"; exit 1 ;;
          esac
          echo "identity OK: account 558069890522, role medzen-arm2-nomination-mint-role"
      - name: attempt the frozen mint (FAILS CLOSED until the sealed authorities are adjudicated)
        run: |
          # live_mint validates caller identity, the index byte-binding, the
          # full-field pin comparison, per-object byte integrity, and the
          # structured training-index + sealed-authority artifacts. The sealed
          # identity-only exclusion authorities require separate owner ledger
          # adjudication (live-mint packet), so TODAY this step refuses — that
          # refusal is the designed, reviewed behavior, not an error in the
          # harness.
          cd "$GITHUB_WORKSPACE"
          PYTHONPATH=scripts python scripts/mint_arm2_nomination_split.py --live
