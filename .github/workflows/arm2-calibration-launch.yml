# Codex review #26 finding 6 / #27 findings 1-2: CALLER for the Arm-2
# calibration launch. The credential-bearing job lives in the reusable
# arm2-calibration-launch-exec.yml (the file the calibration role's
# job_workflow_ref trusts). Owner-initiated with an EXACT reviewed SHA.
#
# Codex #27 finding 1: GitHub silently creates a referenced-but-missing
# environment WITHOUT protection, so the preflight FAILS unless the
# `arm2-calibration` environment already exists WITH required reviewers — an
# unprotected environment can never launch a calibration through this workflow.
name: arm2-calibration-launch

on:
  workflow_dispatch:
    inputs:
      sha:
        description: exact 40-hex reviewed commit to launch from (must be on master)
        required: true
        type: string
      confirm_launch:
        description: pass LAUNCH to create the job; anything else is a dry-run
        required: false
        type: string
        default: ""

permissions:
  contents: read
  id-token: write

jobs:
  preflight:
    runs-on: ubuntu-24.04
    steps:
      - name: configuration must be present (a skip is not a pass)
        run: |
          if [ -z "${{ vars.MEDZEN_ARM2_CALIBRATION_ROLE_ARN }}" ]; then
            echo "::error::MEDZEN_ARM2_CALIBRATION_ROLE_ARN is not set. Apply infra/arm2_calibration_role.tf (arm2_calibration_enabled=true) and set the repo variable — this run FAILS rather than silently skipping."
            exit 1
          fi
          echo "calibration role variable present"
      - name: the arm2-calibration environment must already exist WITH required reviewers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Codex #27 finding 1: refuse to proceed unless the protected
          # environment is real and gated — GitHub would otherwise auto-create
          # it unprotected on first reference and bypass owner approval.
          set -euo pipefail
          RESP=$(gh api "repos/${{ github.repository }}/environments/arm2-calibration" 2>/dev/null || echo '{"__missing__":true}')
          if printf '%s' "$RESP" | grep -q '"__missing__"'; then
            echo "::error::the 'arm2-calibration' environment does not exist — create it with the OWNER as a required reviewer BEFORE launching"
            exit 1
          fi
          REVIEWERS=$(printf '%s' "$RESP" | python3 -c "import json,sys; d=json.load(sys.stdin); rules=[r for r in d.get('protection_rules',[]) if r.get('type')=='required_reviewers']; print(sum(len(r.get('reviewers',[])) for r in rules))")
          if [ "$REVIEWERS" -lt 1 ]; then
            echo "::error::the 'arm2-calibration' environment has no required reviewers — owner approval is not enforced"
            exit 1
          fi
          echo "arm2-calibration environment is protected ($REVIEWERS required reviewer(s))"

  launch:
    needs: preflight
    uses: ./.github/workflows/arm2-calibration-launch-exec.yml
    with:
      sha: ${{ inputs.sha }}
      confirm_launch: ${{ inputs.confirm_launch }}
