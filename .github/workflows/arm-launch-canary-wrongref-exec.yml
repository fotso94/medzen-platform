name: arm-launch-canary-wrongref-exec
# WRONG-REF negative canary, reusable half (Codex review #26 finding 5:
# the direct-job probe only proved a MISSING claim is rejected). This
# IS a reusable workflow, so the token carries a real job_workflow_ref
# — naming THIS file, not arm-launch-exec.yml. Same environment, same
# sub claim: only the workflow identity differs. The assumption MUST
# be refused; the job passes only when it is.
permissions:
  contents: read
  id-token: write
on:
  workflow_call: {}
jobs:
  must-be-refused:
    runs-on: ubuntu-latest
    environment: arm-launch-approval
    if: vars.MEDZEN_ARM_LAUNCH_ROLE_ARN != ''
    steps:
      - uses: aws-actions/configure-aws-credentials@a159d7bb5354cf786f855f2f5d1d8d768d9a08d1 # v5.0.0
        id: assume
        continue-on-error: true
        with:
          role-to-assume: ${{ vars.MEDZEN_ARM_LAUNCH_ROLE_ARN }}
          aws-region: eu-central-1
      - name: the assumption above must have FAILED
        env:
          ASSUME_OUTCOME: ${{ steps.assume.outcome }}
        run: |
          if [ "$ASSUME_OUTCOME" = "success" ]; then
            echo "TRUST POLICY TOO BROAD: a WRONG reusable workflow assumed the arm-launch role"
            exit 1
          fi
          echo "WRONGREF_NEGATIVE_CANARY_OK: wrong job_workflow_ref was refused"
