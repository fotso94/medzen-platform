# B7 Phase 1 — reusable application pipeline (Base v5 B7, PLAN-2026-013).
#
# test -> build linux/amd64 -> scan (fail-closed) -> push to ECR by digest
# -> deploy -> rollout status with a 10-minute timeout that FAILS THE
# PIPELINE, NOT THE CLUSTER (a stuck rollout is surfaced, never forced).
#
# Ships dark: every AWS-touching job is gated on the MEDZEN_CI_ROLE_ARN
# repository variable, which stays empty until the one-time OIDC/CI-role
# packet is reviewed and applied. Until then this pipeline only tests,
# builds and scans - zero credentials, zero cloud mutation.
#
# Auth is OIDC-only (aws-actions/configure-aws-credentials with
# role-to-assume); static AWS keys are prohibited in this repository and
# the test suite asserts none appear here.

name: _service-pipeline

on:
  workflow_call:
    inputs:
      service:
        description: service key in platform/services.yaml
        required: true
        type: string
      test_paths:
        description: "explicit pytest targets for this service (Codex serving review: -k selections collected ZERO tests)"
        required: true
        type: string
      context_path:
        description: docker build context directory
        required: true
        type: string
      ecr_repository:
        description: ECR repository name for the image
        required: true
        type: string
      k8s_deployment:
        description: kubernetes deployment name to roll
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v5.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: install test dependencies
        run: python -m pip install -r requirements.txt pytest pyyaml jsonschema
      - name: generated artifacts must match services.yaml
        run: python platform/generate.py --check
      - name: focused service tests
        run: python -m pytest -q ${{ inputs.test_paths }}

  build-scan:
    needs: test
    runs-on: ubuntu-24.04
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v5.0.1
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - name: build linux/amd64 image
        id: build
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          # B6v2 (Codex serving review): the Dockerfiles COPY
          # services/<svc>/... i.e. repository-ROOT paths, so the build
          # context MUST be the repo root, not the service dir; the
          # Dockerfile is named explicitly and SOURCE_COMMIT supplied
          # (the images `RUN test -n "$SOURCE_COMMIT"`).
          context: .
          file: ${{ inputs.context_path }}/Dockerfile
          build-args: |
            SOURCE_COMMIT=${{ github.sha }}
          platforms: linux/amd64
          load: true
          tags: ${{ inputs.service }}:ci-${{ github.sha }}
      - name: fail-closed vulnerability scan
        uses: docker/scout-action@f8c776824083494ab0d56b8105ba2ca85c86e4de # v1.18.2
        with:
          command: cves
          image: ${{ inputs.service }}:ci-${{ github.sha }}
          only-severities: critical,high
          exit-code: true

  push:
    needs: build-scan
    if: vars.MEDZEN_CI_ROLE_ARN != ''
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v5.0.1
      - name: OIDC federation (no static keys)
        uses: aws-actions/configure-aws-credentials@a159d7bb5354cf786f855f2f5d1d8d768d9a08d1 # v5.0.0
        with:
          role-to-assume: ${{ vars.MEDZEN_CI_ROLE_ARN }}
          aws-region: eu-central-1
      - name: login to ECR
        uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64 # v2.1.6
      - name: rebuild and push by digest
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: ${{ inputs.context_path }}/Dockerfile
          build-args: |
            SOURCE_COMMIT=${{ github.sha }}
          platforms: linux/amd64
          push: true
          tags: 558069890522.dkr.ecr.eu-central-1.amazonaws.com/${{ inputs.ecr_repository }}:${{ github.sha }}

  deploy:
    needs: push
    if: vars.MEDZEN_CI_ROLE_ARN != ''
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v5.0.1
      - name: OIDC federation (no static keys)
        uses: aws-actions/configure-aws-credentials@a159d7bb5354cf786f855f2f5d1d8d768d9a08d1 # v5.0.0
        with:
          role-to-assume: ${{ vars.MEDZEN_CI_ROLE_ARN }}
          aws-region: eu-central-1
      - name: point deployment at the pushed digest
        run: |
          aws eks update-kubeconfig --name medzen-speech --region eu-central-1
          kubectl set image "deployment/${{ inputs.k8s_deployment }}" \
            "${{ inputs.k8s_deployment }}=558069890522.dkr.ecr.eu-central-1.amazonaws.com/${{ inputs.ecr_repository }}:${{ github.sha }}" \
            --namespace medzen
      - name: rollout gate - fails the pipeline, not the cluster
        run: |
          if ! kubectl rollout status "deployment/${{ inputs.k8s_deployment }}" \
              --namespace medzen --timeout=10m; then
            echo "::error::rollout did not become Ready within 10 minutes;" \
                 "the cluster keeps its previous ReplicaSet - investigate, do not force"
            exit 1
          fi
