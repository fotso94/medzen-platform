# Codex stage-1 review (2026-08-25) findings 1-2: the six 2000-step Arm-2
# comparative arms are CAMPAIGN jobs ($5.60 each, but tier is decided by job
# class) and may ONLY launch through this reusable, credential-bearing
# workflow: its job_workflow_ref is what the dedicated
# medzen-arm2-stage1-launch-role trusts, it runs in the owner-approved
# `arm2-stage1-launch` environment (a human gates every launch), the packet
# input is validated against the EXACT-SIX allowlist below, and the launcher's
# above-tier chain (committed APPROVED review record, launch intent, per-arm
# mechanics calibration receipt, ACTIVE campaign reservation, committed
# profile) all still apply in scripts/b5_sagemaker_job.py. SERIAL by design:
# the registry permits ONE active reservation at a time.
name: arm2-stage1-launch-exec

on:
  workflow_call:
    inputs:
      sha:
        description: exact 40-hex reviewed commit to launch from (must be on master)
        required: true
        type: string
      packet:
        description: one of the EXACT six stage-1 packet paths (allowlisted below)
        required: true
        type: string
      confirm_launch:
        description: pass the literal LAUNCH to actually create the job (else dry-run)
        required: false
        type: string
        default: ""

permissions:
  contents: read
  id-token: write

env:
  SHA: ${{ inputs.sha }}
  PACKET: ${{ inputs.packet }}
  # the launcher's above-tier gate requires the protected-executor marker
  # (scripts/b5_sagemaker_job.py EXECUTOR_ENV) — set ONLY here, never locally
  MEDZEN_EXECUTOR: github-protected-workflow

jobs:
  launch:
    runs-on: ubuntu-24.04
    environment: arm2-stage1-launch
    steps:
      - name: the stage-1 launch role variable must be configured (a skip is not a pass)
        run: |
          if [ -z "${{ vars.MEDZEN_ARM2_STAGE1_ROLE_ARN }}" ]; then
            echo "::error::MEDZEN_ARM2_STAGE1_ROLE_ARN is not set — apply infra/arm2_stage1_launch_role.tf and set the repo variable"
            exit 1
          fi
      - name: the packet must be EXACTLY one of the six stage-1 packets
        run: |
          case "$PACKET" in
            platform/manifests/B5-UNIVERSAL-ARM2-KDCONTROL-SAGEMAKER-BINDINGS-2026-001.json) ;;
            platform/manifests/B5-UNIVERSAL-ARM2-H0-SAGEMAKER-BINDINGS-2026-001.json) ;;
            platform/manifests/B5-UNIVERSAL-ARM2-H1-SAGEMAKER-BINDINGS-2026-001.json) ;;
            platform/manifests/B5-UNIVERSAL-ARM2-H2-SAGEMAKER-BINDINGS-2026-001.json) ;;
            platform/manifests/B5-UNIVERSAL-ARM2-H3-SAGEMAKER-BINDINGS-2026-001.json) ;;
            platform/manifests/B5-UNIVERSAL-ARM2-H4-SAGEMAKER-BINDINGS-2026-001.json) ;;
            platform/manifests/B5-UNIVERSAL-ARM2-KDCONTROL-SAGEMAKER-BINDINGS-2026-002.json) ;;
            *) echo "::error::$PACKET is not one of the six allowlisted stage-1 packets"; exit 1 ;;
          esac
      - name: require an exact single-line 40-hex commit
        run: |
          if [ "$(printf '%s' "$SHA" | wc -l)" -ne 0 ] \
              || ! printf '%s' "$SHA" | grep -Exq '[0-9a-f]{40}'; then
            echo "::error::inputs.sha must be a single exact 40-hex commit"
            exit 1
          fi
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v5.0.1
        with:
          ref: ${{ inputs.sha }}
          fetch-depth: 0
      - name: verify the commit is on master and the checkout equals it (pre-credential)
        run: |
          git fetch --quiet origin master
          if ! git merge-base --is-ancestor "$SHA" origin/master; then
            echo "::error::$SHA is not on origin/master — only reviewed master commits are launchable"
            exit 1
          fi
          HEAD_OID="$(git rev-parse HEAD)"
          if [ "$HEAD_OID" != "$SHA" ]; then
            echo "::error::checkout HEAD $HEAD_OID != requested $SHA"
            exit 1
          fi
          echo "checkout verified at $HEAD_OID (on master)"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: install the HASH-LOCKED dependency closure BEFORE any credentials exist
        run: |
          pip install --require-hashes --only-binary=:all: -r scripts/requirements/arm2-launch.txt
      - name: OIDC federation as the dedicated Arm-2 stage-1 launch role
        uses: aws-actions/configure-aws-credentials@a159d7bb5354cf786f855f2f5d1d8d768d9a08d1 # v5.0.0
        with:
          role-to-assume: ${{ vars.MEDZEN_ARM2_STAGE1_ROLE_ARN }}
          aws-region: eu-central-1
      - name: assert the EXACT assumed identity (account + stage-1 launch role)
        run: |
          IDENTITY=$(aws sts get-caller-identity --output json)
          echo "$IDENTITY"
          ACCOUNT=$(printf '%s' "$IDENTITY" | python3 -c "import json,sys; print(json.load(sys.stdin)['Account'])")
          ARN=$(printf '%s' "$IDENTITY" | python3 -c "import json,sys; print(json.load(sys.stdin)['Arn'])")
          if [ "$ACCOUNT" != "558069890522" ]; then
            echo "::error::assumed account $ACCOUNT != 558069890522"; exit 1
          fi
          case "$ARN" in
            *":assumed-role/medzen-arm2-stage1-launch-role/"*) ;;
            *) echo "::error::assumed role ARN $ARN is not medzen-arm2-stage1-launch-role"; exit 1 ;;
          esac
          echo "identity OK: account 558069890522, role medzen-arm2-stage1-launch-role"
      - name: render + validate the stage-1 request (always; no side effects)
        run: |
          python scripts/b5_sagemaker_job.py render --bindings "$PACKET" > request.json
          python scripts/b5_sagemaker_job.py validate --bindings "$PACKET" --request request.json
      - name: launch (ONLY when confirm_launch == LAUNCH)
        if: ${{ inputs.confirm_launch == 'LAUNCH' }}
        run: |
          python scripts/b5_sagemaker_job.py launch --bindings "$PACKET" --request request.json
