# B7 Phase 3 — model pipeline (Base v5 B7: workflow_dispatch -> verify gate
# report -> registry PR; canary rides the alias flip after merge).
#
# The gate report is the authority: no report, no PR. Only languages that
# PASSED may have approved_version bumped; failures stay pinned (§A4).
# Registry-PR creation is dark-gated with the rest of the AWS surface and
# additionally requires B5 reactivation to supply real reports.

name: model-pipeline

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: training run identity (MLflow run / campaign attempt)
        required: true
        type: string
      results_dir:
        description: directory of per-language hash-bound <language>.rows.jsonl files (recompute gate)
        required: true
      candidate_packet_path:
        description: the PREDECLARED candidate packet (round 8+)
        required: true
      manifests_dir:
        description: directory of <language>.holdout-manifest.jsonl sealed manifests
        required: true
      artifact_tree:
        description: full 64-hex artifact tree digest (checkpoint+tokenizer)
        required: true
      anchor_envelope_path:
        description: the separate anchor envelope (packet sha + S3 storage)
        required: true
        type: string
      track:
        description: model track
        required: true
        type: choice
        options: [asr]
      gate_report_path:
        description: committed gate-report artifact path
        required: true
        type: string
      languages:
        description: comma-separated languages whose gates passed
        required: true
        type: string

# Codex review #18 principle: id-token only where OIDC is used — the
# only job needing extra grants (open-registry-pr) documents its own.
permissions:
  contents: read
  id-token: write

jobs:
  verify-gate-report:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v5.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: OIDC federation for live S3/SageMaker verification
        # round 12 (Codex): the complete gate performs LIVE anchor and
        # sealed-job checks — it needs credentials; dark until the CI
        # role variable exists, like every AWS-touching job
        if: vars.MEDZEN_CI_ROLE_ARN != ''
        uses: aws-actions/configure-aws-credentials@a159d7bb5354cf786f855f2f5d1d8d768d9a08d1 # v5.0.0
        with:
          role-to-assume: ${{ vars.MEDZEN_CI_ROLE_ARN }}
          aws-region: eu-central-1
      - name: pinned gate dependencies
        run: >
          python -m pip install "boto3==1.43.58" "PyYAML==6.0.3"
          "cryptography==48.0.1"
      - name: gate report authorizes exactly these languages
        # round 12 (Codex): user inputs pass through ENV, never shell
        # interpolation; the checker invokes the COMPLETE gate — partial
        # invocations refuse by design
        env:
          GATE_REPORT: ${{ inputs.gate_report_path }}
          RESULTS_DIR: ${{ inputs.results_dir }}
          CANDIDATE_PACKET: ${{ inputs.candidate_packet_path }}
          MANIFESTS_DIR: ${{ inputs.manifests_dir }}
          ARTIFACT_TREE: ${{ inputs.artifact_tree }}
          ANCHOR_ENVELOPE: ${{ inputs.anchor_envelope_path }}
        run: |
          python scripts/b7_model_promotion_check.py \
            --gate-report "$GATE_REPORT" \
            --results-dir "$RESULTS_DIR" \
            --candidate-packet "$CANDIDATE_PACKET" \
            --manifests-dir "$MANIFESTS_DIR" \
            --artifact-tree "$ARTIFACT_TREE" \
            --anchor-envelope "$ANCHOR_ENVELOPE" \
            --scorer platform/promotion/scorer_v1.py \
            --write-admission-receipt admission-receipt.json
      - name: sign the admission receipt with the promotion key
        # requires kms:Sign on alias/medzen-promotion-signing — granted
        # only to the owner-approved admission role; dark until then
        if: vars.MEDZEN_CI_ROLE_ARN != ''
        run: |
          python scripts/sign_promotion_document.py admission-receipt.json
      - name: attested receipt artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: admission-receipt
          path: |
            admission-receipt.json
            admission-receipt.json.sig
          if-no-files-found: warn

  open-registry-pr:
    needs: verify-gate-report
    if: vars.MEDZEN_CI_ROLE_ARN != ''
    runs-on: ubuntu-24.04
    permissions:
      contents: write # pushes the registry bump branch, nothing else
      id-token: write
      pull-requests: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v5.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: branch with the per-language approved_version bumps
        run: |
          # ARCH-2026-001 atomic gate (Codex review #9): no language
          # subsetting — the checker evaluates the frozen mandatory set and
          # statistics are recomputed from hash-bound rows
          # round 11 (Codex): the workflow invokes the COMPLETE gate —
          # partial invocations refuse by design
          python scripts/b7_model_promotion_check.py \
            --gate-report "${{ inputs.gate_report_path }}" \
            --results-dir "${{ inputs.results_dir }}" \
            --candidate-packet "${{ inputs.candidate_packet_path }}" \
            --manifests-dir "${{ inputs.manifests_dir }}" \
            --artifact-tree "${{ inputs.artifact_tree }}" \
            --anchor-envelope "${{ inputs.anchor_envelope_path }}" \
            --write-admission-receipt admission-receipt.json
          echo "::error::fail-closed placeholder: the approved_version bump is made"
          echo "::error::through the decode-approvals input to scripts/generate_languages.py,"
          echo "::error::whose promotion schema lands with B5 reactivation. Until that"
          echo "::error::reviewed change, this pipeline verifies gates but opens no PR."
          exit 1
      - name: open the PR for human review
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            await github.rest.pulls.create({
              ...context.repo,
              title: `registry: promote ${{ toJSON(inputs.languages) }} (run ${{ toJSON(inputs.run_id) }})`,
              head: `model-promotion/${{ inputs.run_id }}`,
              base: 'master',
              body: [
                'Gate report: `${{ inputs.gate_report_path }}`',
                'Only PASS languages are bumped; failures stay pinned (§A4).',
                'Merging triggers the canary alias flip for these languages only.',
              ].join('\n'),
            });
