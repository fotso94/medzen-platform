# B7 Phase 3 — model pipeline (Base v5 B7: workflow_dispatch -> verify gate
# report -> registry PR; canary rides the alias flip after merge).
#
# The gate report is the authority: no report, no PR. Only languages that
# PASSED may have approved_version bumped; failures stay pinned (§A4).
# Registry-PR creation is dark-gated with the rest of the AWS surface and
# additionally requires B5 reactivation to supply real reports.

name: model-pipeline

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: training run identity (MLflow run / campaign attempt)
        required: true
        type: string
      results_dir:
        description: directory of per-language hash-bound <language>.rows.jsonl files (recompute gate)
        required: true
        type: string
      track:
        description: model track
        required: true
        type: choice
        options: [asr]
      gate_report_path:
        description: committed gate-report artifact path
        required: true
        type: string
      languages:
        description: comma-separated languages whose gates passed
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  verify-gate-report:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v5.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: gate report authorizes exactly these languages
        run: |
          # ARCH-2026-001 atomic gate (Codex review #9): no language
          # subsetting — the checker evaluates the frozen mandatory set and
          # statistics are recomputed from hash-bound rows
          python scripts/b7_model_promotion_check.py \
            --gate-report "${{ inputs.gate_report_path }}" \
            --results-dir "${{ inputs.results_dir }}"

  open-registry-pr:
    needs: verify-gate-report
    if: vars.MEDZEN_CI_ROLE_ARN != ''
    runs-on: ubuntu-24.04
    permissions:
      contents: write # pushes the registry bump branch, nothing else
      id-token: write
      pull-requests: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v5.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: branch with the per-language approved_version bumps
        run: |
          # ARCH-2026-001 atomic gate (Codex review #9): no language
          # subsetting — the checker evaluates the frozen mandatory set and
          # statistics are recomputed from hash-bound rows
          python scripts/b7_model_promotion_check.py \
            --gate-report "${{ inputs.gate_report_path }}" \
            --results-dir "${{ inputs.results_dir }}"
          echo "::error::fail-closed placeholder: the approved_version bump is made"
          echo "::error::through the decode-approvals input to scripts/generate_languages.py,"
          echo "::error::whose promotion schema lands with B5 reactivation. Until that"
          echo "::error::reviewed change, this pipeline verifies gates but opens no PR."
          exit 1
      - name: open the PR for human review
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            await github.rest.pulls.create({
              ...context.repo,
              title: `registry: promote ${{ toJSON(inputs.languages) }} (run ${{ toJSON(inputs.run_id) }})`,
              head: `model-promotion/${{ inputs.run_id }}`,
              base: 'main',
              body: [
                'Gate report: `${{ inputs.gate_report_path }}`',
                'Only PASS languages are bumped; failures stay pinned (§A4).',
                'Merging triggers the canary alias flip for these languages only.',
              ].join('\n'),
            });
