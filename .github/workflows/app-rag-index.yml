# B7 application pipeline instance for rag-index (generated pattern, edited by review).
name: app-rag-index
on:
  push:
    branches: [master]
    paths:
      - "services/rag-index/**"
      - "platform/services.yaml"
      - ".github/workflows/_service-pipeline.yml"
      - ".github/workflows/app-rag-index.yml"
      # B6v2 round 3 (Codex): the suite files themselves and the shared
      # contract/fixture trees must retrigger this pipeline too
      - "tests/test_rag_index.py"
      - "tests/test_b6_6_registry_rag_alignment.py"
      - "platform/contracts/**"
      - "platform/generated/registry-ssm/**"
permissions:
  contents: read
  id-token: write
jobs:
  pipeline:
    uses: ./.github/workflows/_service-pipeline.yml
    with:
      service: rag-index
      context_path: services/rag-index
      test_paths: "tests/test_rag_index.py tests/test_b6_6_registry_rag_alignment.py"
      ecr_repository: medzen-rag-index
      k8s_deployment: rag-index
