# Codex reviews #19 F5 / #20 F1-F2 / #21 F1-F2: CALLER half of the Arm-2
# trainer-image build. The credential-bearing work lives in the REUSABLE
# arm2-trainer-image-publish.yml (the file the dedicated publisher role's
# job_workflow_ref trust names — the caller/reusable split is the proven
# model-images pattern and the documented home of that claim).
#
# Codex #21 F2: there is NO job-level `if:` on the role variable — a missing
# configuration FAILS the preflight loudly instead of green-skipping the run.
# Owner-initiated (workflow_dispatch on master): building this image is the
# deliberate step that precedes promoting the DRAFT calibration packet.
name: arm2-trainer-image

on:
  workflow_dispatch:
    inputs:
      sha:
        description: exact 40-hex reviewed commit to build/test/publish (must be on master)
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  preflight:
    runs-on: ubuntu-24.04
    steps:
      - name: configuration must be present (a skip is not a pass)
        run: |
          if [ -z "${{ vars.MEDZEN_TRAINER_IMAGE_PUBLISHER_ROLE_ARN }}" ]; then
            echo "::error::MEDZEN_TRAINER_IMAGE_PUBLISHER_ROLE_ARN is not set. Apply infra/trainer_image_publisher.tf (trainer_image_publisher_enabled=true) and set the repo variable to the role ARN — this run FAILS rather than silently skipping."
            exit 1
          fi
          echo "publisher role variable present"

  publish:
    needs: preflight
    uses: ./.github/workflows/arm2-trainer-image-publish.yml
    with:
      sha: ${{ inputs.sha }}
