# B7 application pipeline instance for llm-gateway (generated pattern, edited by review).
name: app-llm-gateway
on:
  push:
    branches: [master]
    paths:
      - "services/llm-gateway/**"
      - "platform/services.yaml"
      - ".github/workflows/_service-pipeline.yml"
      - ".github/workflows/app-llm-gateway.yml"
      # B6v2 round 3 (Codex): the suite files themselves and the shared
      # contract/fixture trees must retrigger this pipeline too
      - "tests/test_llm_gateway.py"
      - "tests/test_llm_contract.py"
      - "platform/contracts/**"
      - "platform/generated/registry-ssm/**"
permissions:
  contents: read
  id-token: write
jobs:
  pipeline:
    uses: ./.github/workflows/_service-pipeline.yml
    with:
      service: llm-gateway
      context_path: services/llm-gateway
      test_paths: "tests/test_llm_gateway.py tests/test_llm_contract.py"
      ecr_repository: medzen-llm-gateway
      k8s_deployment: llm-gateway
