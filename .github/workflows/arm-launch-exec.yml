name: arm-launch-exec
# REUSABLE credential-bearing workflow (owner fast-path packet item 3):
# the OIDC token's job_workflow_ref claim points at THIS file, so the
# role trust binds to it exactly. The protected environment lives on
# THIS job — the owner's Approve click gates every run, canary or
# launch. `mode` is a typed workflow_call input used ONLY in step `if:`
# conditions — never interpolated into shell (injection-safe).
permissions:
  contents: read
  id-token: write
on:
  workflow_call:
    inputs:
      mode:
        description: "canary = STS identity probe only (non-mutating); launch = the real arm launch"
        required: true
        type: string
      sha:
        description: "exact 40-hex reviewed commit to launch from (must be on master); required for launch"
        required: false
        type: string
        default: ""
jobs:
  exec:
    runs-on: ubuntu-latest
    environment: arm-launch-approval
    if: github.ref == 'refs/heads/master' && (inputs.mode == 'canary' || inputs.mode == 'launch')
    env:
      MEDZEN_EXECUTOR: github-protected-workflow
      ROLE_ARN: ${{ vars.MEDZEN_ARM_LAUNCH_ROLE_ARN }}
      # Codex round 31 finding 5B: bind launch to an exact reviewed commit.
      # SHA is referenced ONLY as $SHA in shell after a 40-hex validation
      # (injection-safe, same discipline as `mode`).
      SHA: ${{ inputs.sha }}
      ARM_PACKET: platform/manifests/B5-UNIVERSAL-ARM1-SAGEMAKER-BINDINGS-2026-005.json
      ARM_REQUEST: platform/manifests/B5-UNIVERSAL-ARM1-REQUEST-2026-005.json
    steps:
      - name: the role variable must be configured (skipping is not passing)
        run: |
          if [ -z "$ROLE_ARN" ]; then
            echo "MEDZEN_ARM_LAUNCH_ROLE_ARN is not set — refusing to pretend this run happened (Codex review #28)"
            exit 1
          fi
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v5.0.1
        with:
          ref: ${{ inputs.sha }}
          fetch-depth: 0
      - name: "launch: require an exact 40-hex commit on master; checkout must equal it (pre-credential)"
        if: inputs.mode == 'launch'
        run: |
          if [ "$(printf '%s' "$SHA" | wc -l)" -ne 0 ] \
              || ! printf '%s' "$SHA" | grep -Exq '[0-9a-f]{40}'; then
            echo "::error::inputs.sha must be a single exact 40-hex commit for launch"
            exit 1
          fi
          git fetch --quiet origin master
          if ! git merge-base --is-ancestor "$SHA" origin/master; then
            echo "::error::$SHA is not on origin/master — only reviewed master commits are launchable"
            exit 1
          fi
          HEAD_OID="$(git rev-parse HEAD)"
          if [ "$HEAD_OID" != "$SHA" ]; then
            echo "::error::checkout HEAD $HEAD_OID != requested $SHA"
            exit 1
          fi
          echo "checkout verified at $HEAD_OID (on master)"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: inputs.mode == 'launch'
        with:
          python-version: "3.12"
      - name: install the HASH-LOCKED dependency closure BEFORE any credentials exist
        # Codex round 31 finding 5B: match arm2-calibration-launch-exec.yml —
        # the FULL transitive closure is sha256-locked (torch is deferred and
        # never imported on the render/validate/launch/verify path, so the
        # torch-free calibration closure is exactly what launch needs).
        if: inputs.mode == 'launch'
        run: |
          pip install --require-hashes --only-binary=:all: -r scripts/requirements/arm2-launch.txt
      - name: "canary: print the token's identity claims (non-secret; the negatives prove tokens alone unlock nothing)"
        if: inputs.mode == 'canary'
        run: |
          RAW=$(curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | python3 -c "import json,sys; print(json.load(sys.stdin)['value'])")
          echo "$RAW" | python3 -c "
          import base64, json, sys
          payload = sys.stdin.read().strip().split('.')[1]
          payload += '=' * (-len(payload) % 4)
          claims = json.loads(base64.urlsafe_b64decode(payload))
          for key in ('sub', 'job_workflow_ref', 'workflow_ref',
                      'repository', 'repository_id', 'repository_owner',
                      'repository_owner_id', 'ref', 'environment'):
              print(f'CLAIM {key} = {claims.get(key)}')"
      - uses: aws-actions/configure-aws-credentials@a159d7bb5354cf786f855f2f5d1d8d768d9a08d1 # v5.0.0
        with:
          role-to-assume: ${{ vars.MEDZEN_ARM_LAUNCH_ROLE_ARN }}
          aws-region: eu-central-1
      - name: "canary: assert the EXACT assumed identity, mutate nothing"
        if: inputs.mode == 'canary'
        run: |
          IDENTITY_ARN=$(aws sts get-caller-identity --query Arn --output text)
          echo "assumed: $IDENTITY_ARN"
          case "$IDENTITY_ARN" in
            arn:aws:sts::558069890522:assumed-role/medzen-arm-launch-role/*)
              echo "CANARY_ASSUMED_ROLE_OK: exact account + dedicated role verified" ;;
            *)
              echo "WRONG IDENTITY: expected assumed-role/medzen-arm-launch-role in 558069890522"
              exit 1 ;;
          esac
      - name: launch under the committed gates
        if: inputs.mode == 'launch'
        run: |
          python scripts/b5_sagemaker_job.py launch \
            --bindings "$ARM_PACKET" --request "$ARM_REQUEST"
