# REUSABLE credential-bearing evaluator exec (Codex final-gap correction
# item 1). Its job_workflow_ref is what medzen-arm2-scoring-launch-role
# trusts; every run passes the owner-approved arm2-scoring-eval environment.
name: arm2-scoring-eval-exec

on:
  workflow_call:
    inputs:
      mode:
        required: true
        type: string
      sha:
        required: true
        type: string
      packet:
        required: false
        type: string
        default: ""
      confirm_launch:
        required: false
        type: string
        default: ""
      receipts_s3_uri:
        required: false
        type: string
        default: ""
      receipts_version_id:
        required: false
        type: string
        default: ""
      receipts_sha256:
        required: false
        type: string
        default: ""

permissions:
  contents: read
  id-token: write

env:
  SHA: ${{ inputs.sha }}
  PACKET: ${{ inputs.packet }}
  MEDZEN_EXECUTOR: github-protected-workflow

jobs:
  run:
    runs-on: ubuntu-24.04
    environment: arm2-scoring-eval
    permissions:
      contents: read
      id-token: write
      # attest mode signs the receipts bytes (documented in test_b7_pipelines
      # DOCUMENTED_JOB_ADDITIONS, mirroring the nomination-mint pattern)
      attestations: write
    steps:
      - name: the scoring role variable must be configured (a skip is not a pass)
        run: |
          if [ -z "${{ vars.MEDZEN_ARM2_SCORING_ROLE_ARN }}" ]; then
            echo "::error::MEDZEN_ARM2_SCORING_ROLE_ARN is not set"
            exit 1
          fi
      - name: require an exact single-line 40-hex commit
        run: |
          if [ "$(printf '%s' "$SHA" | wc -l)" -ne 0 ] \
              || ! printf '%s' "$SHA" | grep -Exq '[0-9a-f]{40}'; then
            echo "::error::inputs.sha must be a single exact 40-hex commit"
            exit 1
          fi
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v5.0.1
        with:
          ref: ${{ inputs.sha }}
          fetch-depth: 0
      - name: verify the commit is on master and the checkout equals it (pre-credential)
        run: |
          git fetch --quiet origin master
          if ! git merge-base --is-ancestor "$SHA" origin/master; then
            echo "::error::$SHA is not on origin/master"
            exit 1
          fi
          [ "$(git rev-parse HEAD)" = "$SHA" ] || { echo "::error::checkout != $SHA"; exit 1; }
      - name: "launch: the packet must be an allowlisted scoring packet"
        if: ${{ inputs.mode == 'launch' }}
        run: |
          case "$PACKET" in
            platform/manifests/B5-UNIVERSAL-ARM2-SCORE-*.json) ;;
            *) echo "::error::$PACKET is not an allowlisted B5-UNIVERSAL-ARM2-SCORE-* packet"; exit 1 ;;
          esac
          case "$PACKET" in
            *.DRAFT.json) echo "::error::a DRAFT scoring packet can never launch"; exit 1 ;;
          esac
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: install the HASH-LOCKED dependency closure BEFORE any credentials exist
        run: |
          pip install --require-hashes --only-binary=:all: -r scripts/requirements/arm2-launch.txt
      - name: OIDC federation as the dedicated Arm-2 scoring launch role
        uses: aws-actions/configure-aws-credentials@a159d7bb5354cf786f855f2f5d1d8d768d9a08d1 # v5.0.0
        with:
          role-to-assume: ${{ vars.MEDZEN_ARM2_SCORING_ROLE_ARN }}
          aws-region: eu-central-1
      - name: assert the EXACT assumed identity (account + scoring launch role)
        run: |
          IDENTITY=$(aws sts get-caller-identity --output json)
          ACCOUNT=$(printf '%s' "$IDENTITY" | python3 -c "import json,sys; print(json.load(sys.stdin)['Account'])")
          ARN=$(printf '%s' "$IDENTITY" | python3 -c "import json,sys; print(json.load(sys.stdin)['Arn'])")
          [ "$ACCOUNT" = "558069890522" ] || { echo "::error::wrong account $ACCOUNT"; exit 1; }
          case "$ARN" in
            *":assumed-role/medzen-arm2-scoring-launch-role/"*) ;;
            *) echo "::error::assumed role $ARN is not medzen-arm2-scoring-launch-role"; exit 1 ;;
          esac
      - name: "launch: render + validate (always; no side effects)"
        if: ${{ inputs.mode == 'launch' }}
        run: |
          python scripts/b5_sagemaker_job.py render --bindings "$PACKET" > request.json
          python scripts/b5_sagemaker_job.py validate --bindings "$PACKET" --request request.json
      - name: "launch: create the scoring job (ONLY when confirm_launch == LAUNCH)"
        if: ${{ inputs.mode == 'launch' && inputs.confirm_launch == 'LAUNCH' }}
        run: |
          python scripts/b5_sagemaker_job.py launch --bindings "$PACKET" --request request.json
      - name: "attest: fetch receipts by EXACT VersionId, verify sha"
        if: ${{ inputs.mode == 'attest' }}
        run: |
          set -euo pipefail
          URI="${{ inputs.receipts_s3_uri }}"
          VID="${{ inputs.receipts_version_id }}"
          WANT="${{ inputs.receipts_sha256 }}"
          if [ -z "$URI" ] || [ -z "$VID" ] \
              || ! printf '%s' "$WANT" | grep -Exq '[0-9a-f]{64}'; then
            echo "::error::attest needs receipts_s3_uri + receipts_version_id + 64-hex receipts_sha256"
            exit 1
          fi
          BUCKET="${URI#s3://}"; KEY="${BUCKET#*/}"; BUCKET="${BUCKET%%/*}"
          aws s3api get-object --bucket "$BUCKET" --key "$KEY" --version-id "$VID" receipts.json >/dev/null
          GOT=$(python3 -c "import hashlib;print(hashlib.sha256(open('receipts.json','rb').read()).hexdigest())")
          [ "$GOT" = "$WANT" ] || { echo "::error::receipts sha $GOT != expected $WANT"; exit 1; }
      - name: "attest: sign the exact receipts bytes (Sigstore)"
        if: ${{ inputs.mode == 'attest' }}
        uses: actions/attest-build-provenance@c074443f1aee8d4aeeae555aebba3282517141b2 # v2.2.3
        with:
          subject-path: receipts.json
      - name: "attest: upload receipts + bundle"
        if: ${{ inputs.mode == 'attest' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: attested-receipts
          path: receipts.json
