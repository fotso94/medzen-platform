# B7 Phase 3 — content/RAG pipeline (Base v5 B7: approved doc merge ->
# metadata validation -> build index vN -> retrieval tests -> alias flip).
#
# Clinical-owner approval is enforced through CODEOWNERS on the content
# paths once branch protection activates (activation checklist). The
# index itself is built at image build time by the rag-index application
# pipeline; this workflow proves the content and flips the alias.

name: content-rag-pipeline

on:
  pull_request:
    branches: [main]
    paths:
      - "platform/testdata/rag-index/**"
      - "services/rag-index/**"
  push:
    branches: [main]
    paths:
      - "platform/testdata/rag-index/**"
      - "services/rag-index/**"

permissions:
  contents: read
  id-token: write

jobs:
  validate-and-retrieve:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v5.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: install test dependencies
        run: python -m pip install -r requirements.txt pytest pyyaml jsonschema
      - name: metadata validation and retrieval tests
        run: python -m pytest tests/test_rag_index.py tests/test_b6_6_registry_rag_alignment.py -q

  alias-flip:
    needs: validate-and-retrieve
    if: github.event_name == 'push' && vars.MEDZEN_CI_ROLE_ARN != ''
    runs-on: ubuntu-24.04
    environment: infrastructure # index publication is a serving change: same human gate
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v5.0.1
      - name: OIDC federation (no static keys)
        uses: aws-actions/configure-aws-credentials@a159d7bb5354cf786f855f2f5d1d8d768d9a08d1 # v5.0.0
        with:
          role-to-assume: ${{ vars.MEDZEN_CI_ROLE_ARN }}
          aws-region: eu-central-1
      - name: flip the index alias (previous version retained as rollback evidence)
        run: |
          echo "::notice::alias flip runs scripts/run_b6_5a_registry_publication.py-family tooling"
          echo "::notice::under the B6.5A create-only discipline; production pointer"
          echo "::notice::/medzen/registry/serving/current requires its own packet - refused here."
          exit 1 # intentionally failing placeholder until the activation packet
                 # binds the exact non-production alias parameter this flip may write
