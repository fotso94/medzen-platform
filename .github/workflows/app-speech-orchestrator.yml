# B7 application pipeline instance for speech-orchestrator (generated pattern, edited by review).
name: app-speech-orchestrator
on:
  push:
    branches: [master]
    paths:
      - "services/speech-orchestrator/**"
      - "platform/services.yaml"
      - ".github/workflows/_service-pipeline.yml"
      - ".github/workflows/app-speech-orchestrator.yml"
      # B6v2 round 3 (Codex): the suite files themselves and the shared
      # contract/fixture trees must retrigger this pipeline too
      - "tests/test_speech_orchestrator.py"
      - "tests/test_speech_orchestrator_streaming.py"
      - "tests/test_orchestrator_remote_adapters.py"
      - "tests/test_b6v2_real_provider.py"
      - "tests/test_b6v2_composed_chain.py"
      - "tests/test_b6v2_http_chain.py"
      - "tests/test_b6v2_contracts.py"
      - "platform/contracts/**"
      - "platform/generated/registry-ssm/**"
permissions:
  contents: read
  id-token: write
jobs:
  pipeline:
    uses: ./.github/workflows/_service-pipeline.yml
    with:
      service: speech-orchestrator
      context_path: services/speech-orchestrator
      test_paths: "tests/test_speech_orchestrator.py tests/test_speech_orchestrator_streaming.py tests/test_orchestrator_remote_adapters.py tests/test_b6v2_real_provider.py tests/test_b6v2_composed_chain.py tests/test_b6v2_http_chain.py tests/test_b6v2_contracts.py"
      ecr_repository: medzen-orchestrator
      k8s_deployment: speech-orchestrator
