name: architecture-controls
# Codex review #16: the sealed-machinery guards must run in CI on every
# relevant change, not only locally.
# Codex review #18: this workflow never touches AWS — no OIDC token.
permissions:
  contents: read
on:
  push:
    branches: ["**"]
  pull_request:
jobs:
  controls:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v5.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: install control-test dependencies
        # fastapi/httpx: test_arch imports the orchestrator app (Codex
        # review #27 reproduced ModuleNotFoundError on the runner); the
        # control selection needs NO torch (verified in a bare venv)
        run: |
          pip install pytest pyyaml "boto3==1.40.16" "jsonschema==4.25.0" "numpy==2.3.2" "fastapi==0.141.1" "httpx==0.28.1"
      # The four files below were green only in the local full suite, so a
      # regression in the packet goldens, the scorer's dedup/conflict
      # refusal, the tone-policy identifier or the append-only evidence
      # chain could reach master unnoticed. None of them needs torch
      # (verified: no torch module loads on import), so they run here.
      - name: architecture + sealed-machinery + arm-launch + evidence controls
        run: |
          python -m pytest -q \
            tests/test_arch_2026_001.py \
            tests/test_b5_sagemaker_job.py \
            tests/test_b7_pipelines.py \
            tests/test_arm2_execution_mode.py \
            tests/test_asr_eval_tone_policy.py \
            tests/test_gb10_eval_surface.py \
            tests/test_b6_local_engineering_record.py
