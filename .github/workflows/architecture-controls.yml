name: architecture-controls
# Codex review #16: the sealed-machinery guards must run in CI on every
# relevant change, not only locally.
# Codex review #18: this workflow never touches AWS — no OIDC token.
permissions:
  contents: read
on:
  push:
    branches: ["**"]
  pull_request:
jobs:
  controls:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v5.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: install control-test dependencies
        run: |
          pip install pytest pyyaml "boto3==1.40.16" "jsonschema==4.25.0" "numpy==2.3.2"
          pip install "torch==2.8.0" --index-url https://download.pytorch.org/whl/cpu
      - name: architecture + sealed-machinery + arm-launch controls
        run: python -m pytest tests/test_arch_2026_001.py tests/test_b5_sagemaker_job.py tests/test_b7_pipelines.py -q
