version: medzen.llm.policy-source.v1
classification: B6_2_LOCAL_MOCK_ONLY
defaults:
  engine: bedrock
  citations_required: true
  maximum_citations: 5
  maximum_input_characters: 8000
  maximum_output_tokens: 512
  timeout_ms: 30000
  rules:
    - answer_in_the_requested_language
    - use_only_the_supplied_citations_for_factual_claims
    - preserve_the_user_transcript_without_rewriting_it
    - refuse_when_no_citation_support_is_available
    - never_emit_patient_or_person_identifiers_to_logs
policies:
  acholi-medzen-v1: {language: acholi, response_language: Acholi}
