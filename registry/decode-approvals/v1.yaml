version: decode-approval-v1
status: versioned-source-of-truth
rule: >-
  A promotion-approved decode strategy must bind the exact strategy, prompt and
  token configuration, greedy or beam settings, token cap, normalization,
  frozen evaluation, selecting run, and artifact, code and container provenance.
  Missing or ambiguous evidence remains NOT_EVALUATED and must not be invented.

