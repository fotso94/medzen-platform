inherits: _defaults.yaml
language: kinyarwanda
version: v1-initial
rationale: |
  Bantu language, Latin script without tone marks in the CV17 corpus.
  Largest training corpus in gb1 (300h Common Voice, cc0) and the best-
  measured language in the base-model suite (attempts 32+35: full
  6,657-row coverage, omniASR LLM CER 7.8-8.3%). WER stays primary; the
  suite baseline gives the zero-shot reference the relative gain is
  measured against. OWNER-APPROVED 2026-08-17: WER ceiling 0.30 (presented and approved as
  the kinyarwanda bar with beat-the-41%-baseline; the 0.20 registry
  default was judged too aggressive for the first fine-tune round). The agglutinative morphology
  argues for tracking CER alongside WER without gating on it in v1.
  OWNER-REVISED 2026-08-19: WER ceiling 0.38 (verbatim "revise the bar and
  ship the 35.5% adapter as v1 now"). Evidence basis B5-KW-DECISIVE-2026-001:
  LoRA plateaus at 0.355 dev (0.375-0.387 band) — a 14% relative gain over
  the 0.414 baseline; 0.30 is unreachable by adaptation on this base model
  with matched-domain data. 0.38 covers dev-slice noise; the strict
  beat-the-baseline gate still applies. The full fine-tune experiment
  (owner option B) may later tighten this back down.
  OWNER-DECIDED 2026-08-19 (v1 ship): relative gain override to 0.09 —
  verbatim "yes ship v1 at a 9.3% gain and let the full fine-tune (already
  in motion) try to earn a bigger gain on the full 2,000 hours..if at then
  end we get more gain than 9.3% well ship the trained model as v2".
  Full-pool gate: 0.372 WER / 0.089 CER on 6,657 frozen rows vs 0.410 /
  0.097 baseline (B5-KW-V1-GATE-2026-001).
overrides:
  asr:
    absolute_wer_max: 0.38
    relative_wer_gain_min: 0.09

