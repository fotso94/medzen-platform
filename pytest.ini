[pytest]
markers =
    net: touches the network (shard download); deselected by default
    slow: multi-GB local I/O (base model cache verification); deselected by default
# no:cacheprovider — .pytest_cache must never be written into the
# source tree; the verified bundle is mounted read-only on the
# evaluation instance.
addopts = -m "not net and not slow" -p no:cacheprovider
